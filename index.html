<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Електронний журнал реєстрації заявок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F5F7;
    --surface:#FFFFFF;
    --surface-2:#FAFBFC;
    --ink:#1B2A3D;
    --ink-soft:#5B6B7F;
    --ink-faint:#8B98A8;
    --border:#DCE1E7;
    --border-strong:#C3CBD4;
    --accent:#2C5F8A;
    --accent-ink:#1E4463;
    --accent-soft:#E7EFF5;
    --teal:#3E8E8A;
    --amber:#B98A2E;
    --brick:#B4483A;
    --brick-soft:#F7EAE8;
    --green:#3E7A44;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --radius: 3px;
    --shadow-1: 0 1px 2px rgba(27,42,61,0.06), 0 1px 1px rgba(27,42,61,0.04);
    --shadow-2: 0 8px 28px rgba(27,42,61,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:none;margin:0 auto;padding:20px 14px 64px;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:16px;padding-bottom:18px;margin-bottom:16px;
    border-bottom:2px solid var(--ink);
  }
  .brand{display:flex;align-items:flex-start;gap:12px;}
  .brand svg{flex:none;margin-top:3px;}
  .brand h1{font-size:19px;font-weight:600;margin:0 0 3px;letter-spacing:-0.01em;}
  .org-line{margin:0;color:var(--ink-soft);font-size:12.5px;font-family:var(--mono);}
  .topbar-actions{display:flex;gap:8px;flex:none;padding-top:2px;}

  /* ---------- Buttons ---------- */
  .btn{
    font-family:var(--sans);
    font-size:13px;font-weight:500;
    border-radius:var(--radius);
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--ink);
    padding:8px 14px;
    cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    transition:background .12s ease, border-color .12s ease;
    white-space:nowrap;
  }
  .btn:hover{background:var(--surface-2);border-color:var(--ink-faint);}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);}
  .btn-ghost{background:transparent;}
  .btn-danger{background:var(--brick);border-color:var(--brick);color:#fff;}
  .btn-danger:hover{background:#96382d;border-color:#96382d;}
  .btn-danger-outline{background:transparent;border-color:var(--brick);color:var(--brick);}
  .btn-danger-outline:hover{background:var(--brick-soft);}
  .btn-sm{padding:5px 9px;font-size:12px;}
  .btn-icon{padding:6px;width:30px;height:30px;justify-content:center;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .link-danger{
    background:none;border:none;color:var(--ink-faint);font-family:var(--sans);
    font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;
    padding:0;
  }
  .link-danger:hover{color:var(--brick);}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .search-wrap{position:relative;flex:1;min-width:220px;max-width:360px;}
  .search-wrap input{
    width:100%;padding:8px 10px 8px 30px;border:1px solid var(--border-strong);
    border-radius:var(--radius);font-family:var(--sans);font-size:13px;background:var(--surface);
  }
  .search-wrap input:focus{outline:none;border-color:var(--accent);}
  .search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.5;}
  select.filter-select{
    padding:8px 10px;border:1px solid var(--border-strong);border-radius:var(--radius);
    background:var(--surface);font-family:var(--sans);font-size:13px;color:var(--ink);
  }
  .toolbar-spacer{flex:1;}
  .row-count{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap;}

  /* ---------- Table ---------- */
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow-1);}
  table{border-collapse:collapse;width:100%;min-width:900px;}
  thead th{
    position:sticky;top:0;background:var(--ink);color:#fff;
    font-size:11px;font-weight:600;text-transform:none;letter-spacing:0.01em;
    text-align:left;padding:10px 8px;border-right:1px solid rgba(255,255,255,0.08);
    white-space:nowrap;
  }
  thead th:first-child{width:44px;text-align:center;}
  thead th.col-actions{width:150px;}
  .th-filter-btn{
    background:none;border:none;color:inherit;font:inherit;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;padding:0;position:relative;
  }
  .th-filter-btn:hover{opacity:.85;}
  .th-filter-btn svg{opacity:.75;flex:none;}
  .th-filter-dot{
    width:6px;height:6px;border-radius:50%;background:#7FC4C0;flex:none;
    position:absolute;top:-2px;right:-9px;
  }
  tbody td{
    padding:8px 8px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);
    vertical-align:top;font-size:12.5px;max-width:230px;
  }
  tbody td:first-child{text-align:center;color:var(--ink-faint);font-family:var(--mono);font-size:12px;}
  tbody tr:hover{background:var(--surface-2);cursor:pointer;}
  tbody tr:last-child td{border-bottom:none;}
  td.cell-mono{font-family:var(--mono);font-size:12.5px;}
  td.cell-empty{color:var(--ink-faint);font-style:italic;}
  td.col-actions{white-space:nowrap;}
  .row-actions{display:flex;gap:4px;}
  .row-actions button{opacity:0;transition:opacity .1s;}
  .row-actions button.row-doc{opacity:1;white-space:nowrap;font-size:12px;padding:4px 8px;gap:4px;}
  tbody tr:hover .row-actions button{opacity:1;}

  .status-pill{
    display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;
    border-radius:100px;font-size:12px;font-weight:500;white-space:nowrap;
  }
  .status-dot{width:7px;height:7px;border-radius:50%;flex:none;}

  .empty-state{padding:56px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state h3{margin:0 0 6px;font-size:15px;color:var(--ink);font-weight:600;}
  .empty-state p{margin:0 0 16px;font-size:13px;}

  footer.footnote{
    margin-top:14px;font-size:11.5px;color:var(--ink-faint);
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(27,42,61,0.45);
    display:flex;align-items:flex-start;justify-content:center;
    padding:40px 20px;overflow:auto;z-index:100;
    animation:fade-in .12s ease;
  }
  @keyframes fade-in{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:var(--surface);border-radius:6px;box-shadow:var(--shadow-2);
    width:100%;max-width:560px;max-height:calc(100vh - 80px);display:flex;flex-direction:column;
  }
  .modal.modal-wide{max-width:760px;}
  .modal.modal-narrow{max-width:400px;}
  .modal-head{
    padding:16px 20px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;flex:none;
  }
  .modal-head h2{margin:0;font-size:15px;font-weight:600;}
  .modal-close{background:none;border:none;cursor:pointer;color:var(--ink-faint);padding:4px;}
  .modal-close:hover{color:var(--ink);}
  .modal-body{padding:18px 20px;overflow:auto;flex:1;}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex:none;}
  .modal-foot.foot-split{justify-content:space-between;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field-hint{font-size:11px;color:var(--ink-faint);margin-top:4px;}
  .ktz-box{border:1px solid var(--border);border-radius:4px;padding:10px 12px;background:var(--surface-2);}
  .ktz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .ktz-grid .ktz-wide{grid-column:1 / -1;}
  .ktz-grid label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:3px;}
  .ktz-grid select, .ktz-grid input[type=text], .ktz-grid input[type=number]{width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:4px;font:inherit;background:var(--surface);color:var(--ink);}
  .ktz-grid .hidden{display:none;}
  .ktz-preview{margin-top:8px;font-size:12px;color:var(--ink-soft);}
  .ktz-preview b{color:var(--ink);font-weight:600;}
  @media (max-width:560px){ .ktz-grid{grid-template-columns:1fr;} }
  .field input[type=text], .field input[type=date], .field input[type=password], .field textarea{
    width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:var(--radius);
    font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--surface);
  }
  .field input:focus, .field textarea:focus{outline:none;border-color:var(--accent);}
  .field-row{display:flex;gap:8px;align-items:flex-end;}
  .field-row .field{flex:1;margin-bottom:0;}
  .auto-field{display:flex;gap:6px;}
  .chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .chip-list:empty{margin-bottom:0;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-ink);
    border-radius:100px;padding:4px 6px 4px 11px;font-size:12.5px;font-family:var(--mono);
  }
  .chip-remove{
    background:none;border:none;cursor:pointer;color:var(--accent-ink);opacity:.6;
    display:flex;align-items:center;justify-content:center;padding:2px;border-radius:50%;
  }
  .chip-remove:hover{opacity:1;background:rgba(44,95,138,0.15);}
  .chip-remove svg{width:10px;height:10px;}
  .chip-add-row{display:flex;gap:6px;}
  .chip-add-row .chip-input{flex:1;min-width:0;}
  .chip-add-row input{
    padding:8px 10px;border:1px solid var(--border-strong);border-radius:var(--radius);
    font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--surface);
  }
  .chip-add-row input:focus{outline:none;border-color:var(--accent);}
  .auto-field input{font-family:var(--mono);}

  .select-trigger{
    width:100%;text-align:left;padding:8px 10px;border:1px solid var(--border-strong);
    border-radius:var(--radius);background:var(--surface);font-family:var(--sans);font-size:13px;
    cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--ink);
  }
  .select-trigger:hover{border-color:var(--ink-faint);}
  .select-trigger.placeholder{color:var(--ink-faint);}
  .select-trigger .chev{flex:none;opacity:.5;}

  .popover{
    position:absolute;z-index:200;background:var(--surface);border:1px solid var(--border-strong);
    border-radius:6px;box-shadow:var(--shadow-2);width:280px;max-height:320px;display:flex;flex-direction:column;
    animation:fade-in .1s ease;
  }
  .popover-search{padding:8px;border-bottom:1px solid var(--border);flex:none;}
  .popover-search input{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:3px;font-size:13px;font-family:var(--sans);}
  .popover-search input:focus{outline:none;border-color:var(--accent);}
  .popover-list{overflow:auto;padding:4px;flex:1;}
  .popover-item{
    padding:7px 9px;border-radius:3px;cursor:pointer;font-size:13px;
    display:flex;align-items:center;gap:8px;
  }
  .popover-item:hover{background:var(--accent-soft);}
  .popover-item.selected{background:var(--accent-soft);font-weight:600;}
  .popover-add{
    padding:7px 9px;border-radius:3px;cursor:pointer;font-size:12.5px;color:var(--accent);
    border-top:1px solid var(--border);margin-top:4px;
  }
  .popover-add:hover{background:var(--accent-soft);}
  .popover-empty{padding:14px 9px;color:var(--ink-faint);font-size:12.5px;text-align:center;}

  /* ---------- Columns manager ---------- */
  .col-row{
    display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);
  }
  .col-row:last-of-type{border-bottom:none;}
  .col-reorder{display:flex;flex-direction:column;gap:1px;flex:none;}
  .col-reorder button{background:none;border:none;cursor:pointer;color:var(--ink-faint);padding:0;line-height:1;}
  .col-reorder button:hover{color:var(--ink);}
  .col-reorder button:disabled{opacity:.25;cursor:default;}
  .col-label-input{
    flex:1;min-width:0;padding:6px 8px;border:1px solid transparent;border-radius:3px;
    font-family:var(--sans);font-size:13px;font-weight:500;background:transparent;
  }
  .col-label-input:hover{border-color:var(--border);}
  .col-label-input:focus{outline:none;border-color:var(--accent);background:var(--surface);}
  .col-type-badge{
    flex:none;font-size:10.5px;font-family:var(--mono);color:var(--ink-soft);
    background:var(--surface-2);border:1px solid var(--border);border-radius:3px;padding:3px 7px;
  }
  .col-dir-name{flex:none;font-size:11px;color:var(--ink-faint);font-family:var(--mono);}

  .add-col-box{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:6px;padding:14px;margin-top:14px;}
  .add-col-box h3{margin:0 0 10px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .type-toggle{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .type-toggle button{
    padding:6px 11px;border:1px solid var(--border-strong);border-radius:100px;background:var(--surface);
    font-size:12px;cursor:pointer;color:var(--ink-soft);
  }
  .type-toggle button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .checkbox-row{display:flex;align-items:center;gap:7px;margin-bottom:10px;}
  .checkbox-row input{margin:0;}
  .checkbox-row label{font-size:12.5px;color:var(--ink-soft);margin:0;font-weight:400;}

  /* ---------- Directories manager ---------- */
  .dir-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap;}
  .dir-tab{
    padding:8px 13px;font-size:12.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;
    border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;
  }
  .dir-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .dir-entry{display:flex;align-items:center;gap:8px;padding:6px 0;}
  .dir-entry input{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--border);border-radius:3px;font-size:13px;font-family:var(--sans);}
  .dir-entry .swatch{
    width:16px;height:16px;border-radius:50%;flex:none;cursor:pointer;border:2px solid transparent;
  }
  .dir-entry .swatch.active-swatch{border-color:var(--ink);}
  .swatch-row{display:flex;gap:6px;}
  .add-entry-row{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .add-entry-row input{flex:1;padding:7px 9px;border:1px solid var(--border-strong);border-radius:3px;font-size:13px;font-family:var(--sans);}

  /* ---------- Confirm dialog ---------- */
  .confirm-icon{
    width:38px;height:38px;border-radius:50%;background:var(--brick-soft);color:var(--brick);
    display:flex;align-items:center;justify-content:center;flex:none;margin-bottom:10px;
  }
  .confirm-text{font-size:13px;color:var(--ink-soft);line-height:1.55;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:5px;font-size:13px;
    box-shadow:var(--shadow-2);z-index:300;display:flex;align-items:center;gap:8px;
  }
  .toast.error{background:var(--brick);}

  /* ---------- Користувачі / авторство ---------- */
  .user-badge{
    font-size:12.5px;color:var(--ink-soft);align-self:center;padding:0 6px;white-space:nowrap;
    max-width:260px;overflow:hidden;text-overflow:ellipsis;
  }
  .stamp-name{font-weight:500;font-size:12.5px;}
  .stamp-time{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:1px;}
  .user-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .user-row.user-off .user-name{color:var(--ink-faint);text-decoration:line-through;}
  .user-name{font-weight:600;font-size:13.5px;}
  .user-self{font-weight:400;color:var(--ink-faint);font-size:12px;}
  .user-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .user-meta .mono{font-family:var(--mono);}
  .user-actions{display:flex;gap:6px;flex-wrap:wrap;}

  /* ---------- Lock screen ---------- */
  .lock-overlay{
    position:fixed;inset:0;background:var(--bg);
    display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;
  }
  .lock-card{
    background:var(--surface);border:1px solid var(--border);border-radius:6px;
    box-shadow:var(--shadow-2);width:100%;max-width:360px;padding:30px 26px 26px;
  }
  .lock-card .brand{margin-bottom:20px;flex-direction:column;align-items:center;text-align:center;gap:8px;}
  .lock-card .org-line{text-align:center;}
  .lock-intro{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;text-align:center;line-height:1.5;}
  .lock-error{color:var(--brick);font-size:12px;margin:-4px 0 10px;min-height:14px;}
  .lock-hint{font-size:11px;color:var(--ink-faint);margin:14px 0 0;line-height:1.5;text-align:center;}
  .lock-card input[type=text], .lock-card input[type=password]{
    width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:var(--radius);
    font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--surface);
  }
  .lock-card input[type=text]:focus, .lock-card input[type=password]:focus{outline:none;border-color:var(--accent);}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width: 640px){
    #app{padding:14px;}
    .topbar{flex-direction:column;gap:10px;}
    .toolbar{flex-direction:column;align-items:stretch;}
    .search-wrap{max-width:none;}
    .toolbar-spacer{display:none;}
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div id="app" style="display:none;">

  <div class="topbar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <rect x="1" y="6" width="28" height="18" rx="1" stroke="#1B2A3D" stroke-width="1.6"/>
        <line x1="5" y1="6" x2="5" y2="11" stroke="#1B2A3D" stroke-width="1.6"/>
        <line x1="9" y1="6" x2="9" y2="9.5" stroke="#1B2A3D" stroke-width="1.4"/>
        <line x1="13" y1="6" x2="13" y2="11" stroke="#1B2A3D" stroke-width="1.6"/>
        <line x1="17" y1="6" x2="17" y2="9.5" stroke="#1B2A3D" stroke-width="1.4"/>
        <line x1="21" y1="6" x2="21" y2="11" stroke="#1B2A3D" stroke-width="1.6"/>
        <line x1="25" y1="6" x2="25" y2="9.5" stroke="#1B2A3D" stroke-width="1.4"/>
      </svg>
      <div class="brand-text">
        <h1>Електронний журнал реєстрації заявок</h1>
        <p class="org-line">Центр №40 · ДП «Укрметртестстандарт»</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="user-badge" id="userBadge"></span>
      <button class="btn btn-ghost" id="btnUsers" style="display:none;">Користувачі</button>
      <button class="btn btn-ghost" id="btnDirectories" style="display:none;">Довідники</button>
      <button class="btn btn-ghost" id="btnColumns" style="display:none;">Стовпці</button>
      <button class="btn btn-ghost" id="btnKtz" style="display:none;">Авто-довідник</button>
      <button class="btn btn-ghost" id="btnChangePassword">Пароль</button>

<script>
(function(){
  "use strict";

  // ЗАМІНІТЬ рядок нижче на URL вашого розгорнутого Apps Script Web App
  // (у Google Таблиці: Розширення → Apps Script → Розгорнути → Веб-застосунок)
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYQGTSMVui-NbTm7c87jYBc0AsZ72ZVQXmYEWcs_RIo8IjMxICZYpkUtD5_B6wIJn9/exec";
  // Той самий ключ, що й ACCESS_KEY у Code.gs. Придумайте довгий випадковий
  // рядок (наприклад, згенерований пароль) і вставте однаково в обидва місця.
  var ACCESS_KEY = "C3sRLYioLy8JDcVfG2BgFXEwANoIIygq";
  var state = null;
  var filters = { q: "", dateRanges: {}, textFilters: {}, statusFilters: {}, selectFilters: {} };
  var openPopover = null; // currently open popover element + cleanup

  /* ============ helpers ============ */
  function uid(prefix){ return (prefix||"id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function pad4(n){ return String(n).padStart(4,"0"); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function fmtDateTime(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return "";
    function p(n){ return String(n).padStart(2,"0"); }
    return p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes());
  }
  function fmtDate(iso){
    if(!iso) return "";
    var p = iso.split("-");
    if(p.length!==3) return iso;
    return p[2]+"."+p[1]+"."+p[0];
  }
  var SWATCHES = ["#2C5F8A","#3E8E8A","#B98A2E","#3E7A44","#B4483A","#7A5C9E","#5B6B7F","#B0733E"];

  function defaultState(){
    return {
      columns: [
        {id:"appNum", label:"№ заявки", type:"text", auto:true, autoPrefix:"№ 400-"},
        {id:"certNum", label:"№ сертифіката", type:"multitext", auto:true, autoPrefix:"UA.46E.", autoSuffixSep:"-", autoYearDigits:2, autoPad:0},
        {id:"date", label:"Дата", type:"date"},
        {id:"docNum", label:"№ рахунку / акту / договору", type:"text", auto:true, autoPrefix:"400-В"},
        {id:"customer", label:"ПІП Замовника (назва організації)", type:"select", directory:"customers"},
        {id:"service", label:"Назва послуги", type:"select", directory:"services"},
        {id:"status", label:"Статус виконання", type:"status", directory:"statuses"},
        {id:"note", label:"Примітка", type:"text"}
      ],
      directoryLabels: { customers:"Замовники", services:"Послуги", statuses:"Статуси" },
      directories: {
        customers: [],
        services: ["Повірка засобів вимірювальної техніки","Калібрування засобів вимірювальної техніки","Сертифікація продукції","Атестація методик вимірювань"],
        statuses: [
          {label:"Нова заявка", color:"#8A93A3"},
          {label:"В обробці", color:"#2C5F8A"},
          {label:"Виконується", color:"#B98A2E"},
          {label:"Готово до видачі", color:"#3E8E8A"},
          {label:"Завершено", color:"#3E7A44"},
          {label:"Скасовано", color:"#B4483A"}
        ]
      },
      rows: []
    };
  }

  /* ============ сесія і зв'язок із бекендом (Google Apps Script) ============ */
  var SESSION_STORAGE_KEY = "ujournal-session-v1";
  var session = null;              // { token, expiresAt } — токен видає сервер після входу
  var me = null;                   // { username, displayName, role }
  var sessionExpiredShown = false;

  function isConfigured(){
    return APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf("СЮДИ_ВСТАВТЕ") === -1 &&
           ACCESS_KEY && ACCESS_KEY.indexOf("СЮДИ_ВСТАВТЕ") === -1;
  }

  function withKey_(url){
    var sep = url.indexOf("?") === -1 ? "?" : "&";
    return url + sep + "key=" + encodeURIComponent(ACCESS_KEY);
  }

  function isAdmin_(){ return !!(me && me.role === "admin"); }

  // Ім'я користувача для відображення (словник імен приходить із сервера).
  function userName_(username){
    if(!username) return "";
    var names = state && state.userNames;
    return (names && names[username]) || username;
  }

  // Видаляти можна лише власні заявки; адміністратор — будь-які.
  // (Те саме примусово перевіряє й сервер — це лише щоб не показувати зайвих кнопок.)
  function canDeleteRow_(row){
    return isAdmin_() || !!(row && row.createdBy && me && row.createdBy === me.username);
  }

  // Токен тримаємо в sessionStorage: переживає оновлення сторінки, але зникає
  // при закритті вкладки. Пароль ніде не зберігається.
  function saveSession_(){ try{ sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(session)); }catch(e){} }
  function restoreSession_(){
    try{
      var s = JSON.parse(sessionStorage.getItem(SESSION_STORAGE_KEY));
      if(s && s.token && s.expiresAt > Date.now()) return s;
    }catch(e){}
    return null;
  }
  function clearSession_(){
    session = null; me = null;
    try{ sessionStorage.removeItem(SESSION_STORAGE_KEY); }catch(e){}
  }

  // Сирий запит до бекенда. Кидає виняток лише при мережевій/HTTP помилці.
  async function rpc_(action, payload, noToken){
    var body = Object.assign({ action: action }, payload || {});
    if(!noToken && session) body.token = session.token;
    var res = await fetch(withKey_(APPS_SCRIPT_URL), {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error("http " + res.status);
    var jr = await res.json();
    if(jr && jr.state) clientMigrate_(jr.state);
    return jr;
  }

  // Запасне розпізнавання колонок «Заявник» і «Назва продукції», якщо сервер
  // ще не оновлений (старі типи select/text). Нічого не змінює на сервері.
  function clientMigrate_(st){
    try{
      (st.columns||[]).forEach(function(c){
        var lbl = String(c.label||"");
        if(c.type==="select" && c.directory==="customers" && /(замовник|заявник)/i.test(lbl)){ c.type="applicant"; delete c.directory; }
        else if((c.type==="text" || (c.type==="select" && c.directory==="cars")) && /продукц/i.test(lbl)){
          c.type="ktz"; delete c.directory; delete c.auto; delete c.autoPrefix; delete c.autoSuffixSep; delete c.autoYearDigits; delete c.autoPad;
        }
      });
    }catch(e){}
  }

  // Завантажує журнал і дані поточного користувача. Не ковтає помилки: виклик
  // сам показує відповідний екран (ключ, сесія, зв'язок).
  async function loadState(){
    var data = await rpc_("load");
    if(data.error === "unauthorized"){ var e1 = new Error("unauthorized"); e1.isAuthError = true; throw e1; }
    if(data.error === "unauthenticated"){ var e2 = new Error("unauthenticated"); e2.isSessionError = true; throw e2; }
    if(data.error === "state_corrupted"){ var e4 = new Error("state_corrupted"); e4.isCorrupted = true; throw e4; }
    if(!data.ok) throw new Error(data.error || "load failed");
    me = data.me;
    if(data.state === null){
      // Сховище порожнє — перший запуск. Засіяти структуру може лише адміністратор.
      if(me.role === "admin"){
        var init = await rpc_("initState", { state: defaultState() });
        if(!init.ok) throw new Error(init.error || "init failed");
        return { state: init.state, me: me };
      }
      var e3 = new Error("not_initialized"); e3.notInitialized = true; throw e3;
    }
    return { state: data.state, me: me };
  }

  // Дія над журналом із токеном сесії. Повертає відповідь сервера як є
  // ({ok:true,...} або {ok:false,error:"..."}), щоб виклик сам вирішив, як
  // реагувати. null — лише при мережевій помилці (тост уже показано тут).
  async function postAction_(action, payload){
    try{
      var data = await rpc_(action, payload);
      if(data && data.error === "unauthenticated") handleSessionExpired_();
      return data;
    }catch(e){
      showToast("Не вдалося зв'язатися з сервером. Перевірте інтернет-з'єднання і спробуйте ще раз.","error");
      return null;
    }
  }

  var ERROR_TEXT_ = {
    unauthorized: "Невірний ключ доступу до бекенда",
    forbidden: "Недостатньо прав для цієї дії",
    not_found: "Цей запис більше не існує — можливо, його вже видалив інший користувач",
    busy: "Сервер зайнятий, спробуйте ще раз за кілька секунд",
    bad_username: "Логін: 3–32 символи — латиниця, цифри, крапка, дефіс, підкреслення",
    bad_display_name: "Вкажіть ім'я (до 80 символів)",
    weak_password: "Пароль має містити щонайменше 8 символів",
    user_exists: "Користувач з таким логіном уже існує",
    cannot_modify_self: "Не можна змінити власну роль чи вимкнути власний обліковий запис",
    last_admin: "У системі має лишатися хоча б один активний адміністратор",
    invalid_credentials: "Невірний пароль",
    not_initialized: "Журнал ще не ініціалізовано",
    state_corrupted: "Дані журналу пошкоджені — зверніться до адміністратора"
  };
  function errorText_(code){ return ERROR_TEXT_[code] || "Не вдалося виконати дію"; }
  function toastActionError_(result){
    if(result && result.error === "unauthenticated") return; // екран входу вже показано
    showToast(errorText_(result && result.error), "error");
  }

  // Якщо сервер змінив номер (його тим часом зайняв інший користувач), повідомляємо про це
  function renumberNote_(r){
    if(!r || !r.renumbered) return "";
    var k = Object.keys(r.renumbered)[0];
    var x = r.renumbered[k];
    return ". Номер " + x.from + " уже був зайнятий, тому присвоєно " + x.to;
  }
  function persistAddRow(rowId, values){ return postAction_("addRow", { rowId: rowId, values: values }).then(function(r){ if(r && r.ok) flushApplicant_(values); return r; }); }
  function persistUpdateRow(rowId, values, expectedRev){ return postAction_("updateRow", { rowId: rowId, values: values, expectedRev: expectedRev }).then(function(r){ if(r && r.ok) flushApplicant_(values); return r; }); }
  function persistDeleteRow(rowId){ return postAction_("deleteRow", { rowId: rowId }); }

  // Додавання значення в довідник (замовник, послуга, статус): доступне всім,
  // на сервері лише дописується — нічого не перезаписується.
  async function persistDirEntry(dirKey, entry){
    var r = await postAction_("addDirEntry", { dirKey: dirKey, entry: entry });
    if(!r) return;
    if(!r.ok){ toastActionError_(r); return; }
    if(state && r.state){ state.directories = r.state.directories; state.userNames = r.state.userNames; }
  }

  // Структура журналу (стовпці, довідники) — лише адміністратор. Відправки
  // йдуть по черзі, з невеликою затримкою, щоб швидкі правки не засмічували запити.
  var configTimer = null, configChain = Promise.resolve();
  function persistConfig(){
    if(configTimer) clearTimeout(configTimer);
    configTimer = setTimeout(function(){
      configChain = configChain.then(async function(){
        var r = isAdmin_()
          ? await postAction_("saveConfig", { columns: state.columns, directories: state.directories, directoryLabels: state.directoryLabels, ktzLists: state.ktzLists })
          : await postAction_("saveLists", { directories: state.directories, ktzLists: state.ktzLists });
        if(r && !r.ok) toastActionError_(r);
      });
    }, 250);
  }

  /* ============ toast ============ */
  var toastTimer = null;
  function showToast(msg, kind, ms){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "toast" + (kind==="error" ? " error" : "");
    el.hidden = false;
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.hidden = true; }, ms || 2800);
  }

  /* ============ render: table ============ */
  function directoryLabel(key){
    return (state.directoryLabels && state.directoryLabels[key]) || key;
  }

  function statusOf(label){
    var list = state.directories.statuses || [];
    for(var i=0;i<list.length;i++) if(list[i].label===label) return list[i];
    return null;
  }

  // Службові стовпці: автора і час ставить сервер, у картці заявки їх не редагують.
  var SYSTEM_COLS = [
    { id: "__createdBy", label: "Вніс" },
    { id: "__updatedBy", label: "Остання зміна" }
  ];
  function systemFieldText_(row, colId){
    var u = colId === "__createdBy" ? row.createdBy : row.updatedBy;
    return u ? (userName_(u) + " " + u) : "";
  }
  function stampCellHtml_(username, iso){
    if(!username) return "<td class=\"cell-empty\">—</td>";
    return "<td><div class=\"stamp-name\">"+esc(userName_(username))+"</div><div class=\"stamp-time\">"+esc(fmtDateTime(iso))+"</div></td>";
  }

  function renderHead(){
    var tr = document.getElementById("tableHeadRow");
    var html = "<th>№ п/п</th>";
    state.columns.forEach(function(c){
      var active;
      if(c.type === "date"){
        active = !!(filters.dateRanges[c.id] && (filters.dateRanges[c.id].from || filters.dateRanges[c.id].to));
      } else if(c.type === "status"){
        active = !!filters.statusFilters[c.id];
      } else if(c.type === "select"){
        active = !!filters.selectFilters[c.id];
      } else {
        active = !!filters.textFilters[c.id];
      }
      html += "<th><button type=\"button\" class=\"th-filter-btn\" data-filter-col=\""+c.id+"\" data-filter-type=\""+c.type+"\">"+esc(c.label)+iconFilter()+(active?"<span class=\"th-filter-dot\"></span>":"")+"</button></th>";
    });
    SYSTEM_COLS.forEach(function(sc){
      var act = !!filters.textFilters[sc.id];
      html += "<th><button type=\"button\" class=\"th-filter-btn\" data-filter-col=\""+sc.id+"\" data-filter-type=\"text\">"+esc(sc.label)+iconFilter()+(act?"<span class=\"th-filter-dot\"></span>":"")+"</button></th>";
    });
    html += "<th class=\"col-actions\">Дії</th>";
    tr.innerHTML = html;
    tr.querySelectorAll("[data-filter-col]").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var colId = btn.getAttribute("data-filter-col");
        var type = btn.getAttribute("data-filter-type");
        if(type === "date") openDateFilterPopover(btn, colId);
        else if(type === "status") openStatusFilterPopover(btn, colId);
        else if(type === "select") openSelectFilterPopover(btn, colId);
        else openTextFilterPopover(btn, colId);
      });
    });
  }

  function openDateFilterPopover(anchorEl, colId){
    closePopover();
    var rect = anchorEl.getBoundingClientRect();
    var pop = document.createElement("div");
    pop.className = "popover";
    pop.style.top = (window.scrollY + rect.bottom + 4) + "px";
    pop.style.left = (window.scrollX + rect.left) + "px";
    pop.style.width = "250px";
    pop.style.color = "var(--ink)";

    var current = filters.dateRanges[colId] || {};
    var mode = (current.from && current.from === current.to) ? "exact" : (current.from || current.to) ? "range" : "exact";

    pop.innerHTML =
      "<div style=\"padding:10px;\">"+
        "<div class=\"type-toggle\" style=\"margin-bottom:10px;\">"+
          "<button type=\"button\" data-mode=\"exact\" class=\""+(mode==="exact"?"active":"")+"\">Конкретна дата</button>"+
          "<button type=\"button\" data-mode=\"range\" class=\""+(mode==="range"?"active":"")+"\">Період</button>"+
        "</div>"+
        "<div id=\"dfExactWrap\" style=\""+(mode==="exact"?"":"display:none;")+"\">"+
          "<div class=\"field\" style=\"margin-bottom:8px;\"><input type=\"date\" id=\"dfExact\" value=\""+esc(mode==="exact"?(current.from||""):"")+"\"></div>"+
        "</div>"+
        "<div id=\"dfRangeWrap\" style=\""+(mode==="range"?"":"display:none;")+"\">"+
          "<div class=\"field\" style=\"margin-bottom:8px;\"><label style=\"font-weight:400;\">З</label><input type=\"date\" id=\"dfFrom\" value=\""+esc(mode==="range"?(current.from||""):"")+"\"></div>"+
          "<div class=\"field\" style=\"margin-bottom:8px;\"><label style=\"font-weight:400;\">По</label><input type=\"date\" id=\"dfTo\" value=\""+esc(mode==="range"?(current.to||""):"")+"\"></div>"+
        "</div>"+
        "<div style=\"display:flex;gap:8px;\">"+
          "<button type=\"button\" class=\"btn btn-ghost btn-sm\" id=\"dfClear\" style=\"flex:1;justify-content:center;\">Скинути</button>"+
          "<button type=\"button\" class=\"btn btn-primary btn-sm\" id=\"dfApply\" style=\"flex:1;justify-content:center;\">Застосувати</button>"+
        "</div>"+
      "</div>";

    document.body.appendChild(pop);

    var modeSel = mode;
    pop.querySelectorAll("[data-mode]").forEach(function(btn){
      btn.addEventListener("click", function(){
        modeSel = btn.getAttribute("data-mode");
        pop.querySelectorAll("[data-mode]").forEach(function(b){ b.classList.toggle("active", b===btn); });
        pop.querySelector("#dfExactWrap").style.display = modeSel === "exact" ? "" : "none";
        pop.querySelector("#dfRangeWrap").style.display = modeSel === "range" ? "" : "none";
      });
    });

    pop.querySelector("#dfClear").addEventListener("click", function(){
      delete filters.dateRanges[colId];
      closePopover();
      renderAll();
    });
    pop.querySelector("#dfApply").addEventListener("click", function(){
      if(modeSel === "exact"){
        var d = pop.querySelector("#dfExact").value;
        if(d) filters.dateRanges[colId] = { from: d, to: d }; else delete filters.dateRanges[colId];
      } else {
        var from = pop.querySelector("#dfFrom").value;
        var to = pop.querySelector("#dfTo").value;
        if(from || to) filters.dateRanges[colId] = { from: from || null, to: to || null }; else delete filters.dateRanges[colId];
      }
      closePopover();
      renderAll();
    });

    function outsideClick(e){
      if(!pop.contains(e.target) && e.target !== anchorEl && !anchorEl.contains(e.target)){
        closePopover();
      }
    }
    setTimeout(function(){ document.addEventListener("mousedown", outsideClick); }, 0);
    openPopover = { el: pop, cleanup: function(){ document.removeEventListener("mousedown", outsideClick); } };
  }

  function openTextFilterPopover(anchorEl, colId){
    closePopover();
    var rect = anchorEl.getBoundingClientRect();
    var pop = document.createElement("div");
    pop.className = "popover";
    pop.style.top = (window.scrollY + rect.bottom + 4) + "px";
    pop.style.left = (window.scrollX + rect.left) + "px";
    pop.style.width = "230px";
    pop.style.color = "var(--ink)";

    var current = filters.textFilters[colId] || "";
    pop.innerHTML =
      "<div style=\"padding:10px;\">"+
        "<div class=\"field\" style=\"margin-bottom:8px;\"><input type=\"text\" id=\"tfInput\" placeholder=\"Текст для фільтрації…\" value=\""+esc(current)+"\"></div>"+
        "<div style=\"display:flex;gap:8px;\">"+

  function matchesFilters(row){
    var selectOk = Object.keys(filters.selectFilters).every(function(colId){
      return row.values[colId] === filters.selectFilters[colId];
    });
    if(!selectOk) return false;
    var statusOk = Object.keys(filters.statusFilters).every(function(colId){
      return row.values[colId] === filters.statusFilters[colId];
    });
    if(!statusOk) return false;
    var dateOk = Object.keys(filters.dateRanges).every(function(colId){
      var range = filters.dateRanges[colId];
      var v = row.values[colId];
      if(!v) return false;
      if(range.from && v < range.from) return false;
      if(range.to && v > range.to) return false;
      return true;
    });
    if(!dateOk) return false;
    var textOk = Object.keys(filters.textFilters).every(function(colId){
      var needle = filters.textFilters[colId];
      if(!needle) return true;
      var v = colId.indexOf("__") === 0 ? systemFieldText_(row, colId) : row.values[colId];
      return v && String(v).toLowerCase().indexOf(needle.toLowerCase()) !== -1;
    });
    if(!textOk) return false;
    if(filters.q){
      var q = filters.q.toLowerCase();
      var found = state.columns.some(function(c){
        var v = row.values[c.id];
        return v && String(v).toLowerCase().indexOf(q) !== -1;
      }) || SYSTEM_COLS.some(function(sc){
        return systemFieldText_(row, sc.id).toLowerCase().indexOf(q) !== -1;
      });
      if(!found) return false;
    }
    return true;
  }

  // Сортування: запам'ятовується окремо для кожного користувача (у цьому браузері)
  function sortStoreKey_(){ return "journalSort:" + (me ? me.username : ""); }
  function getSort_(){
    try{ var v = localStorage.getItem(sortStoreKey_()); if(v && /^(default|app-desc|app-asc|date-desc|date-asc)$/.test(v)) return v; }catch(e){}
    return "default";
  }
  function setSort_(v){ try{ localStorage.setItem(sortStoreKey_(), v); }catch(e){} }
  function appNumKey_(v){
    var m = String(v || "").match(/(\d+)\s*\/\s*(\d{4})/);
    if(m) return parseInt(m[2],10) * 1000000 + parseInt(m[1],10);
    var d = String(v || "").match(/\d+/);
    return d ? parseInt(d[0],10) : -1;
  }
  function sortRows_(list){
    var mode = getSort_();
    if(mode === "default") return list;
    var dir = /asc$/.test(mode) ? 1 : -1;
    var byApp = mode.indexOf("app") === 0;
    var appCol = state.columns.find(function(c){ return c.id === "appNum"; });
    var dateCol = state.columns.find(function(c){ return c.type === "date"; });
    var dec = list.map(function(r, i){
      var key = byApp ? appNumKey_(appCol ? r.values[appCol.id] : "") : String((dateCol && r.values[dateCol.id]) || "");
      return { r:r, i:i, k:key };
    });
    dec.sort(function(a, b){
      var ae = byApp ? a.k < 0 : !a.k, be = byApp ? b.k < 0 : !b.k;
      if(ae !== be) return ae ? 1 : -1;       // порожні — завжди в кінці
      if(a.k < b.k) return -dir;
      if(a.k > b.k) return dir;
      return (a.i - b.i) * dir;
    });
    return dec.map(function(x){ return x.r; });
  }

      }
      tbody.innerHTML = html;
    }

    document.getElementById("rowCount").textContent = visible.length + " з " + state.rows.length + (state.rows.length===1 ? " заявки" : " заявок");

    tbody.querySelectorAll("tr[data-row-id]").forEach(function(tr){

      });

    tbody.querySelectorAll(".row-edit").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        openRequestModal(btn.closest("tr").getAttribute("data-row-id"));

    tbody.querySelectorAll(".row-delete").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var id = btn.closest("tr").getAttribute("data-row-id");
        confirmDialog({
          title:"Видалити заявку?",
          text:"Цю дію не можна скасувати. Запис буде остаточно видалено з журналу.",

  // Прив'язує до текстового поля живі підказки з довідника: показуються
  // одразу при фокусі й фільтруються по мірі введення тексту.
  function attachComboBox(inputEl, dirKey, colId, draft){
    function showList(){
      closePopover();
      var query = inputEl.value.trim();
      var items = state.directories[dirKey] || [];
      var tokens = query.toLowerCase().split(/\s+/).filter(Boolean);
      var filtered = tokens.length ? items.filter(function(v){
        var lv = String(v).toLowerCase();
        return tokens.every(function(t){ return lv.indexOf(t) !== -1; });
      }) : items;
      var totalFound = filtered.length;
      if(filtered.length > 150) filtered = filtered.slice(0, 150);
      var rect = inputEl.getBoundingClientRect();
      var pop = document.createElement("div");
      pop.className = "popover";
      pop.style.top = (window.scrollY + rect.bottom + 4) + "px";
      pop.style.left = (window.scrollX + rect.left) + "px";
      pop.style.width = Math.max(rect.width, 220) + "px";
      pop.style.color = "var(--ink)";

      var listHtml;
      if(filtered.length === 0){
        listHtml = "<div class=\"popover-empty\">"+(items.length===0?"Довідник порожній":"Нічого не знайдено")+"</div>";
      } else {
        listHtml = filtered.map(function(v){
          return "<div class=\"popover-item\" data-pick=\""+esc(v)+"\">"+esc(v)+"</div>";
        }).join("");
        if(totalFound > filtered.length) listHtml += "<div class=\"popover-empty\">Показано "+filtered.length+" з "+totalFound+" — уточніть пошук</div>";
      }
      var addHtml = "";
      if(query && !items.some(function(v){ return v.toLowerCase() === query.toLowerCase(); })){
        addHtml = "<div class=\"popover-add\" data-add=\"1\">+ Додати «"+esc(query)+"»</div>";
      }
      pop.innerHTML = "<div class=\"popover-list\">"+listHtml+"</div>"+addHtml;
      document.body.appendChild(pop);

      pop.querySelectorAll("[data-pick]").forEach(function(item){
        // mousedown (not click) so this fires before the input's blur closes the popover
        item.addEventListener("mousedown", function(e){
          e.preventDefault();
          var v = item.getAttribute("data-pick");
          inputEl.value = v;
          draft[colId] = v;
          closePopover();
        });
      });
      var addEl = pop.querySelector("[data-add]");
      if(addEl){
        addEl.addEventListener("mousedown", function(e){
          e.preventDefault();
          if(!state.directories[dirKey]) state.directories[dirKey] = [];
          state.directories[dirKey].push(query);
          persistDirEntry(dirKey, query);
          inputEl.value = query;
          draft[colId] = query;
          closePopover();
        });
      }

      function outsideClick(e){
        if(!pop.contains(e.target) && e.target !== inputEl){
          closePopover();
        }
      }
      setTimeout(function(){ document.addEventListener("mousedown", outsideClick); }, 0);
      openPopover = { el: pop, cleanup: function(){ document.removeEventListener("mousedown", outsideClick); } };
    }

    inputEl.addEventListener("focus", showList);
    inputEl.addEventListener("input", function(){
      draft[colId] = inputEl.value;
      showList();
    });
  }

      var listEl = pop.querySelector(".popover-list");

        row.addEventListener("click", function(){
          config.onSelect(row.getAttribute("data-key"));

        });
      });

        if(config.onAdd && query && !config.items.some(function(it){ return it.label.toLowerCase()===query.toLowerCase(); })){

  /* ============ request modal (add/edit row) ============ */
  function escapeRegExp_(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  function autoYearStr_(col){
    var year = new Date().getFullYear();
    return col.autoYearDigits === 2 ? String(year).slice(-2) : String(year);
  }
  function autoSep_(col){ return col.autoSuffixSep != null ? col.autoSuffixSep : "/"; }
  function autoPad_(col){ return col.autoPad != null ? col.autoPad : 4; }

  function generateAutoValue(col, numberValue){
    var pad = autoPad_(col);
    var numStr = pad ? String(numberValue).padStart(pad, "0") : String(numberValue);
    return (col.autoPrefix||"") + numStr + autoSep_(col) + autoYearStr_(col);
  }

  // Збирає всі значення автонумерованої колонки з усього журналу — і зі
  // звичайних (один рядок = одне значення), і з багатозначних полів
  // (один рядок = масив значень, напр. кілька номерів сертифікатів).
  // excludeRowId — пропустити рядок, що зараз редагується: його актуальний
  // (ще не збережений) вміст передається окремо через extra, інакше стара
  // версія цього ж рядка в state.rows завадила б звільненому номеру
  // повернутись одразу, без збереження.
  function collectAutoValues_(col, excludeRowId){
    var vals = [];
    state.rows.forEach(function(r){
      if(excludeRowId && r.id === excludeRowId) return;
      var v = r.values[col.id];
      if(Array.isArray(v)) vals = vals.concat(v);
      else if(typeof v === "string" && v) vals.push(v);
    });
    return vals;
  }

  // Наступний номер обчислюється від фактичних значень, що лишились у журналі
  // (найбільше використане число поточного року/формату + 1), а не від
  // збереженого лічильника. Тому після видалення останнього запису (або
  // номера в межах рядка) номер повертається. extra — додаткові значення (ще
  // не збережені), які теж слід враховувати, щоб не запропонувати один і той
  // самий номер двічі.
  function nextAutoNumber(col, extra, excludeRowId){
    var re = new RegExp("^" + escapeRegExp_(col.autoPrefix||"") + "(\\d+)" + escapeRegExp_(autoSep_(col)) + autoYearStr_(col) + "$");
    var all = collectAutoValues_(col, excludeRowId).concat(extra||[]);
    var max = 0;
    all.forEach(function(v){
      if(typeof v !== "string") return;
      var m = v.match(re);
      if(m){
        var num = parseInt(m[1], 10);
        if(!isNaN(num) && num > max) max = num;
      }
    });
    return max + 1;
  }

rt", "Range Rover Evoque", "Defender"], "Lexus": ["ES", "IS", "GS", "LS", "NX", "RX", "LX", "UX"], "Porsche": ["911", "Cayenne", "Macan", "Panamera", "Taycan"], "Subaru": ["Impreza", "Legacy", "Forester", "Outback", "XV"], "Suzuki": ["Swift", "SX4", "Vitara", "Grand Vitara", "Jimny"], "Seat": ["Ibiza", "Leon", "Toledo", "Ateca", "Arona"], "Jeep": ["Renegade", "Compass", "Cherokee", "Grand Cherokee", "Wrangler"], "Dacia": ["Logan", "Sandero", "Duster", "Dokker"], "Chery": ["Tiggo", "Tiggo 4", "Tiggo 7", "Tiggo 8", "Amulet"], "Geely": ["Emgrand", "Coolray", "Atlas", "MK"], "Great Wall": ["Hover H5", "Hover H6", "Poer", "Wingle"], "ВАЗ (Lada)": ["2101-2107 (Класика)", "2108-21099 (Самара)", "2110-2112", "Приора", "Калина", "Гранта", "Vesta", "Niva"], "ЗАЗ": ["Славута", "Сенс", "Ланос", "Vida", "Форза"], "УАЗ": ["Патріот", "Хантер", "3909 (буханка)"], "ГАЗ": ["Газель", "Газель Next", "Соболь", "31029 (Волга)"], "MAN": ["TGL", "TGM", "TGS", "TGX"], "Scania": ["P-series", "G-series", "R-series", "S-series"], "Volvo Trucks": ["FL", "FE", "FM", "FH", "FMX"], "Iveco": ["Daily", "Eurocargo", "Stralis", "Trakker"], "DAF": ["LF", "CF", "XF"], "Mercedes-Benz (вантажні)": ["Actros", "Atego", "Axor"], "Renault Trucks": ["Premium", "Magnum", "T-series", "D-series"], "Інша марка": []};
  var KTZ_DEFAULT_PURPOSES = ["легковий автомобіль","вантажний автомобіль","мотоцикл","автобус","причеп","напівпричеп","трактор","самохідна машина"];
  // Поточні списки: адміністратор може їх змінювати (зберігаються в журналі), інакше стандартні.
  function ktzData_(){
    var k = state && state.ktzLists;
    if(k && Array.isArray(k.purposes) && k.marques && typeof k.marques === "object") return k;
    return { purposes: KTZ_DEFAULT_PURPOSES, marques: MARQUES };
  }

  // Збирає «Назву продукції» з частин: «Марка Модель, призначення, 2018 р.»
  function ktzCompose_(p){
    var parts = [];
    var mm = p.custom ? p.custom.trim() : [p.marka, (p.model && p.model !== "__other__") ? p.model : ""].join(" ").trim();
    if(mm) parts.push(mm);
    if(p.purpose) parts.push(p.purpose);
    if(p.year) parts.push(p.year + " р.");
    if(p.qty && parseInt(p.qty, 10) > 1) parts.push(parseInt(p.qty, 10) + " шт.");
    return parts.join(", ");
  }

  // Розбирає раніше збережений рядок назад на частини; що не впізнано — йде у ручне поле.
  function ktzParse_(val){
    var p = { purpose:"", year:"", marka:"", model:"", custom:"", qty:"" };
    var rest = String(val || "").trim();
    if(!rest) return p;
    var mq = rest.match(/,\s*(\d+)\s*шт\.$/);
    if(mq){ p.qty = mq[1]; rest = rest.slice(0, mq.index).trim(); }
    var my = rest.match(/,\s*(\d{4})\s*р\.$/);
    if(my){ p.year = my[1]; rest = rest.slice(0, my.index).trim(); }
    ktzData_().purposes.forEach(function(pu){
      var suf = ", " + pu;
      if(!p.purpose && rest.length >= suf.length && rest.slice(-suf.length) === suf){ p.purpose = pu; rest = rest.slice(0, -suf.length).trim(); }
    });
    var best = "";
    Object.keys(ktzData_().marques).forEach(function(k){
      if((rest === k || rest.indexOf(k + " ") === 0) && k.length > best.length) best = k;
    });
    if(best){
      var mod = rest.slice(best.length).trim();
      p.marka = best;
      if(mod && ktzData_().marques[best].indexOf(mod) !== -1) p.model = mod;
      else if(mod){ p.model = "__other__"; p.custom = mod; }
    } else if(rest){
      p.custom = rest;
    }
    return p;
  }

  function ktzFieldHtml_(c, val){
    var p = ktzParse_(val);
    function opts(list, sel, blank){
      return "<option value=''>"+blank+"</option>" + list.map(function(x){
        return "<option value='"+esc(x)+"'"+(x === sel ? " selected" : "")+">"+esc(x)+"</option>";
      }).join("");
    }
    var nowY = new Date().getFullYear(), years = [];
    for(var y = nowY; y >= 1950; y--) years.push(String(y));
    var needCustom = !!p.custom;
    return "<div class='field'><label>"+esc(c.label)+"</label>"+
      "<div class='ktz-box' data-ktz='"+esc(c.id)+"'><div class='ktz-grid'>"+
        "<div><label>Призначення КТЗ</label><select data-ktz-part='purpose'>"+opts(ktzData_().purposes, p.purpose, "— оберіть —")+"</select></div>"+
        "<div><label>Рік виготовлення/реєстрації</label><select data-ktz-part='year'>"+opts(years, p.year, "— оберіть —")+"</select></div>"+
        "<div><label>Торгова марка</label><select data-ktz-part='marka'>"+opts(Object.keys(ktzData_().marques), p.marka, "— оберіть —")+"</select></div>"+
        "<div data-ktz-wrap='model' class='"+(p.marka ? "" : "hidden")+"'><label>Комерційна назва / модель</label><select data-ktz-part='model'></select></div>"+
        "<div class='ktz-wide "+(needCustom || !p.marka ? "" : "hidden")+"' data-ktz-wrap='custom'><label>Марка і модель вручну</label>"+
          "<input type='text' data-ktz-part='custom' value='"+esc(p.custom)+"' placeholder='напр. Іномарка XYZ'></div>"+
        "<div><label>Кількість одиниць, шт.</label><input type='number' min='1' max='9999' step='1' data-ktz-part='qty' value='"+esc(p.qty || "1")+"'></div>"+
      "</div><div class='ktz-preview'>Буде записано: <b data-ktz-preview>—</b></div></div></div>";
  }

  function wireKtz_(box, colId, draft){
    var p = ktzParse_(draft[colId]);
    function el(n){ return box.querySelector("[data-ktz-part='"+n+"']"); }
    function wrap(n){ return box.querySelector("[data-ktz-wrap='"+n+"']"); }
    var selModel = el("model");
    function fillModels(){
      var m = el("marka").value, list = ktzData_().marques[m] || [];
      selModel.innerHTML = "<option value=''>— оберіть —</option>" +
        list.map(function(x){ return "<option value='"+esc(x)+"'>"+esc(x)+"</option>"; }).join("") +
        "<option value='__other__'>Інша модель…</option>";
      wrap("model").classList.toggle("hidden", !m);
    }
    function sync(){
      var m = el("marka").value, mod = selModel.value;
      var showCustom = !m || mod === "__other__";
      wrap("custom").classList.toggle("hidden", !showCustom);
      var customVal = showCustom ? el("custom").value : "";
      var v;
      v = ktzCompose_({
        marka: m, model: mod,
        custom: (!m ? customVal : ""),
        purpose: el("purpose").value, year: el("year").value, qty: el("qty").value
      });
      // «Інша модель» для відомої марки: марка + вписаний текст
      if(m && mod === "__other__"){
        var other = el("custom").value.trim();
        v = ktzCompose_({ marka: m, model: other, custom: "", purpose: el("purpose").value, year: el("year").value, qty: el("qty").value });
      }
      draft[colId] = v;
      box.querySelector("[data-ktz-preview]").textContent = v || "—";
    }
    fillModels();
    if(p.marka && p.model) selModel.value = p.model;
    el("marka").addEventListener("change", function(){ fillModels(); sync(); });
    ["purpose","year","model"].forEach(function(n){ el(n).addEventListener("change", sync); });
    el("custom").addEventListener("input", sync);
    el("qty").addEventListener("input", sync);
    box.querySelector("[data-ktz-preview]").textContent = draft[colId] || "—";
  }


  /* ============ адмін: редагування списків «Колісний ТЗ» ============ */
  var ktzTab = "purposes", ktzBrand = "";

  function ktzEnsureOwn_(){
    if(!state.ktzLists){
      state.ktzLists = { purposes: KTZ_DEFAULT_PURPOSES.slice(), marques: JSON.parse(JSON.stringify(MARQUES)) };
    }
    return state.ktzLists;
  }
  function ktzSave_(){ persistConfig(); }
