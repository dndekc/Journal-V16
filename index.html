          var list = ktzEnsureOwn_().marques[ktzBrand]; if(list.indexOf(v) === -1) list.push(v);
          ktzSave_(); renderKtzModal();
        });
      }
    }
  }


  /* ============ «Заявник»: фізична / юридична особа з підказками ============ */
  var pendingApplicant_ = null;

  function applicantDisplay_(r){
    if(!r) return "";
    if(r.type === "individual") return (r.name || "").trim();
    var n = (r.name || "").trim();
    return n ? (r.edrpou ? n + ", код ЄДРПОУ " + String(r.edrpou).trim() : n) : "";
  }
  function applicantList_(){ return (state && Array.isArray(state.applicants)) ? state.applicants : []; }

  // Із рядка в клітинці відновлює поля: спершу шукає в довіднику, потім розбирає формат «…, код ЄДРПОУ …».
  function applicantParse_(val){
    var rec = { type:"legal", name:"", edrpou:"", passport:"", idCode:"", address:"", represents:"" };
    var v = String(val || "").trim();
    if(!v) return rec;
    var found = applicantList_().find(function(r){ return applicantDisplay_(r) === v; });
    if(found) return Object.assign(rec, found);
    var m = v.match(/^(.*),\s*код ЄДРПОУ\s*(\d+)\s*$/);
    if(m){ rec.name = m[1].trim(); rec.edrpou = m[2]; return rec; }
    rec.name = v;
    return rec;
  }

  // Розбирає довгий рядок зі старого довідника («Прізвище Ім'я По батькові, ІПН, адреса» / «ТОВ "…", код, адреса»).
  function legacyApplicant_(str){
    var v = String(str).trim();
    var isOrg = /(^|\s)(ТОВ|ПП|ФОП|АТ|ПАТ|ПрАТ|ДП|КП|ТзОВ|ПФ|ГО|ОСББ)(\s|"|«|$)/i.test(v) || /ЄДРПОУ|ЭДРПОУ/i.test(v) || /["«»]/.test(v);
    var parts = v.split(/\s*,\s*/);
    if(isOrg){
      var m = v.match(/(?:ЄДРПОУ|ЭДРПОУ)\D{0,3}(\d{8,10})/i);
      var code = m ? m[1] : "";
      var name = parts[0].trim();
      var rest = parts.slice(1).filter(function(x){
        var d = x.trim();
        if(/^\d{5}$/.test(d)) return false;
        if(/^\d{8,10}$/.test(d)){ if(!code) code = d; return false; }
        return !/^(код\s*)?(ЄДРПОУ|ЭДРПОУ)/i.test(d);
      }).join(", ").replace(/код\s*(ЄДРПОУ|ЭДРПОУ)\s*\d+\s*/ig, "").replace(/,\s*$/, "").trim();
      return { type:"legal", name:name, edrpou:code, passport:"", idCode:"", address:rest, represents:"" };
    }
    var pm = v.match(/паспорт\s+([^,]+?)(?=,|$)/i);
    var im = v.match(/(?:ІПН\s*)?(?:^|[\s,])(\d{10})(?=,|$|\s)/i);
    // ПІБ: слова до першої коми або цифри/«паспорт»/«ІПН»/адресного слова
    var nm = v.split(",")[0].replace(/\s*(паспорт|ІПН|Київська|Вінницька|Віницька|Черкаська|м\.|с\.|смт).*$/i, "").trim();
    var addr = parts.slice(1).filter(function(x){
      var d = x.trim();
      return !/^(ІПН\s*)?\d{8,10}$/i.test(d) && !/^паспорт\b/i.test(d);
    }).join(", ").replace(/паспорт\s+[^,]+,?\s*/ig, "").replace(/ІПН\s*\d{10}\s*,?\s*/ig, "").replace(/,\s*$/, "").trim();
    var head = parts[0].slice(nm.length).trim();
    if(head && !/^(паспорт|ІПН)/i.test(head)) addr = (head + (addr ? ", " + addr : "")).trim();
    var idm9 = v.match(/(?:^|,\s*)(\d{9})(?=,|$)/);
    if(idm9 && !(pm)) pm = [null, idm9[1]];
    return { type:"individual", name:nm, edrpou:"", passport: pm ? pm[1].trim() : "", idCode: im ? im[1] : "", address:addr, represents:"" };
  }

  function applicantFieldHtml_(c, val){
    var r = applicantParse_(val);
    var id = esc(c.id);
    function inp(part, v, extra){ return "<input type='text' data-ap='"+part+"' value='"+esc(v)+"' autocomplete='off' "+(extra||"")+">"; }
    return "<div class='field'><label>"+esc(c.label)+"</label>"+
      "<div class='ktz-box' data-applicant='"+id+"'>"+
        "<div style='display:flex;gap:16px;margin-bottom:10px;flex-wrap:wrap;'>"+
          "<label style='display:flex;gap:6px;align-items:center;font-size:13px;'><input type='radio' name='aptype_"+id+"' value='legal' data-ap-type"+(r.type==="legal"?" checked":"")+"> Юридична особа</label>"+
          "<label style='display:flex;gap:6px;align-items:center;font-size:13px;'><input type='radio' name='aptype_"+id+"' value='individual' data-ap-type"+(r.type==="individual"?" checked":"")+"> Фізична особа</label>"+
        "</div>"+
        "<div class='ktz-grid'>"+
          "<div class='ktz-wide' data-ap-wrap='legal'><label>Назва організації</label>"+inp("orgName", r.type==="legal"?r.name:"", "placeholder='Почніть вводити назву — підкажемо з довідника'")+"</div>"+
          "<div data-ap-wrap='legal'><label>Код ЄДРПОУ</label>"+inp("edrpou", r.edrpou, "inputmode='numeric' maxlength='10'")+"</div>"+
          "<div class='ktz-wide' data-ap-wrap='individual'><label>Прізвище, ім'я, по батькові</label>"+inp("pib", r.type==="individual"?r.name:"", "placeholder='Почніть вводити прізвище — підкажемо з довідника'")+"</div>"+
          "<div data-ap-wrap='individual'><label>Паспорт (серія, номер)</label>"+inp("passport", r.passport)+"</div>"+
          "<div data-ap-wrap='individual'><label>Ідентифікаційний код</label>"+inp("idCode", r.idCode, "inputmode='numeric' maxlength='10'")+"</div>"+
          "<div class='ktz-wide'><label>Адреса</label>"+inp("address", r.address)+"</div>"+
          "<div class='ktz-wide'><label>Якщо заявник є представником підприємства — назва підприємства</label>"+inp("represents", r.represents, "placeholder='залиште порожнім, якщо не застосовується'")+"</div>"+
        "</div>"+
        "<div class='ktz-preview'>Буде записано: <b data-ap-preview>—</b></div>"+
      "</div></div>";
  }

  function wireApplicant_(box, colId, draft){
    var rec0 = applicantParse_(draft[colId]);
    function el(p){ return box.querySelector("[data-ap='"+p+"']"); }
    function curType(){ return box.querySelector("[data-ap-type]:checked").value; }
    function showType(){
      var t = curType();
      box.querySelectorAll("[data-ap-wrap]").forEach(function(w){ w.classList.toggle("hidden", w.getAttribute("data-ap-wrap") !== t); });
    }
    function record(){
      var t = curType();
      return {
        type: t,
        name: (t === "legal" ? el("orgName").value : el("pib").value).trim(),
        edrpou: t === "legal" ? el("edrpou").value.trim() : "",
        passport: t === "individual" ? el("passport").value.trim() : "",
        idCode: t === "individual" ? el("idCode").value.trim() : "",
        address: el("address").value.trim(),
        represents: el("represents").value.trim()
      };
    }
    function sync(){
      var r = record(), d = applicantDisplay_(r);
      draft[colId] = d;
      box.querySelector("[data-ap-preview]").textContent = d || "—";
      pendingApplicant_ = r.name ? { colId: colId, display: d, record: r } : null;
    }
    var filledName = null;
    function dropStaleFill(inputEl){
      if(filledName === null) return;
      var now = inputEl.value.trim().toLowerCase(), was = filledName.toLowerCase();
      if(now.indexOf(was.slice(0, 3)) !== 0){
        ["edrpou","passport","idCode","address","represents"].forEach(function(p){ el(p).value = ""; });
        filledName = null;
      }
    }
    function fill(r){
      filledName = r.name || "";
      var t = r.type === "individual" ? "individual" : "legal";
      box.querySelector("[data-ap-type][value='"+t+"']").checked = true;
      showType();
      el("orgName").value = t === "legal" ? (r.name || "") : "";
      el("edrpou").value = r.edrpou || "";
      el("pib").value = t === "individual" ? (r.name || "") : "";
      el("passport").value = r.passport || "";
      el("idCode").value = r.idCode || "";
      el("address").value = r.address || "";
      el("represents").value = r.represents || "";
      sync();
    }
    // підказки: записи довідника заявників + розібрані рядки старого довідника «Замовники»
    function suggestions(t, q){
      var tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
      var out = applicantList_().filter(function(r){ return r.type === t; });
      var byName = {};
      out.forEach(function(r){ byName[(r.name || "").toLowerCase()] = 1; });
      var legacy = {};
      ((state.directories && state.directories.customers) || []).forEach(function(n){
        if(typeof n !== "string" || !n.trim()) return;
        var r = legacyApplicant_(n);
        if(r.type !== t) return;
        var k = (r.name || "").toLowerCase();
        if(!k || byName[k]) return;
        var cur = legacy[k];
        var score = (r.edrpou ? 1 : 0) + (r.idCode ? 1 : 0) + (r.passport ? 1 : 0) + (r.address ? 1 : 0);
        if(!cur || score > cur.score) legacy[k] = { r: r, score: score };
      });
      Object.keys(legacy).forEach(function(k){ out.push(legacy[k].r); });
      if(tokens.length) out = out.filter(function(r){
        var hay = ((r.name || "") + " " + (r.edrpou || "") + " " + (r.idCode || "")).toLowerCase();
        return tokens.every(function(tk){ return hay.indexOf(tk) !== -1; });
      });
      return out.slice(0, 40);
    }
    function attachSuggest(inputEl, t){
      function show(){
        closePopover();
        var q = inputEl.value.trim();
        if(!q) return;
        var items = suggestions(t, q);
        if(!items.length) return;
        var rect = inputEl.getBoundingClientRect();
        var pop = document.createElement("div");
        pop.className = "popover";
        pop.style.top = (window.scrollY + rect.bottom + 4) + "px";
        pop.style.left = (window.scrollX + rect.left) + "px";
        pop.style.width = Math.max(rect.width, 280) + "px";
        pop.style.color = "var(--ink)";
        pop.innerHTML = "<div class=\"popover-list\">"+items.map(function(r, i){
          var sub = t === "legal" ? (r.edrpou ? "ЄДРПОУ " + r.edrpou : "") : (r.idCode ? "ІПН " + r.idCode : "");
          return "<div class=\"popover-item\" data-pick=\""+i+"\">"+esc(r.name)+(sub ? " <span style=\"color:var(--ink-faint);font-size:11.5px;\">· "+esc(sub)+"</span>" : "")+"</div>";
        }).join("")+"</div>";
        document.body.appendChild(pop);
        pop.querySelectorAll("[data-pick]").forEach(function(it){
          it.addEventListener("mousedown", function(e){
            e.preventDefault();
            fill(items[parseInt(it.getAttribute("data-pick"), 10)]);
            closePopover();
          });
        });
        function outside(e){ if(!pop.contains(e.target) && e.target !== inputEl) closePopover(); }
        setTimeout(function(){ document.addEventListener("mousedown", outside); }, 0);
        openPopover = { el: pop, cleanup: function(){ document.removeEventListener("mousedown", outside); } };
      }
      inputEl.addEventListener("input", function(){ dropStaleFill(inputEl); sync(); show(); });
      inputEl.addEventListener("focus", show);
    }
    box.querySelectorAll("[data-ap-type]").forEach(function(r){ r.addEventListener("change", function(){ showType(); sync(); }); });
    ["edrpou","passport","idCode","address","represents"].forEach(function(p){ el(p).addEventListener("input", sync); });
    attachSuggest(el("orgName"), "legal");
    attachSuggest(el("pib"), "individual");
    showType();
    box.querySelector("[data-ap-preview]").textContent = draft[colId] || "—";
    pendingApplicant_ = null;
  }

  // Після успішного збереження заявки дописуємо заявника в спільний довідник.
  function flushApplicant_(values){
    var p = pendingApplicant_;
    if(!p || !values || values[p.colId] !== p.display) return;
    pendingApplicant_ = null;
    (function(){
      var rec = p.record, list = state.applicants || (state.applicants = []);
      function k(r){ return r.type + "|" + String(r.name || "").toLowerCase() + "|" + String((r.type === "legal" ? r.edrpou : r.idCode) || "").toLowerCase(); }
      var key = k(rec), idx = -1;
      list.forEach(function(r, i){ if(k(r) === key) idx = i; });
      if(idx === -1) list.push(rec); else list[idx] = rec;
    })();
    postAction_("saveApplicant", { applicant: p.record }).then(function(r){
      if(r && r.ok && r.state && state) state.applicants = r.state.applicants;
    });
  }

  function openRequestModal(rowId){
    var editing = !!rowId;
    var row = editing ? state.rows.find(function(r){ return r.id === rowId; }) : { id: uid("row"), values: {} };
    var knownRev = editing && row ? (row.rev || null) : null;
    var draft = Object.assign({}, row.values);

    // prefill defaults for a new row
    if(!editing){
      state.columns.forEach(function(c){
        if(c.type === "date" && !draft[c.id]) draft[c.id] = todayISO();
        if(c.auto && c.type !== "multitext" && !draft[c.id]) draft[c.id] = generateAutoValue(c, nextAutoNumber(c));
        if(c.type === "status" && !draft[c.id] && (state.directories.statuses||[]).length){
          draft[c.id] = state.directories.statuses[0].label;
        }
      });
    }
    // багатозначні поля зберігаємо як окремий (клонований) масив, щоб
    // редагування в модалці не чіпало дані рядка до натискання "Зберегти"
    state.columns.forEach(function(c){
      if(c.type === "multitext"){
        draft[c.id] = Array.isArray(draft[c.id]) ? draft[c.id].slice() : [];
      }
    });

    var fieldsHtml = state.columns.map(function(c){
      var val = draft[c.id] || "";
      if(c.type === "multitext"){
        return "<div class=\"field\"><label>"+esc(c.label)+"</label>"+
          "<div class=\"chip-list\" data-chip-list=\""+c.id+"\">"+chipsInnerHtml_(draft[c.id])+"</div>"+
          "<div class=\"chip-add-row\">"+
            "<input type=\"text\" class=\"chip-input\" data-chip-input=\""+c.id+"\" placeholder=\"Номер сертифіката…\">"+
            "<button type=\"button\" class=\"btn btn-ghost btn-sm\" data-chip-add=\""+c.id+"\">Додати</button>"+
            (c.auto ? "<button type=\"button\" class=\"btn btn-ghost btn-sm\" data-chip-auto=\""+c.id+"\">Авто</button>" : "")+
          "</div>"+
          (c.auto ? "<div class=\"field-hint\">За замовчуванням один номер; можна додати ще. «Авто» підставляє наступний за порядком.</div>" : "")+
        "</div>";
      }
      if(c.type === "date"){
        return "<div class=\"field\"><label>"+esc(c.label)+"</label><input type=\"date\" data-field=\""+c.id+"\" value=\""+esc(val)+"\"></div>";
      }
      if(c.auto){
        return "<div class=\"field\"><label>"+esc(c.label)+"</label>"+
          "<div class=\"auto-field\">"+
            "<input type=\"text\" data-field=\""+c.id+"\" value=\""+esc(val)+"\">"+
            "<button type=\"button\" class=\"btn btn-ghost btn-sm\" data-auto-regen=\""+c.id+"\">Авто</button>"+
          "</div>"+
          "<div class=\"field-hint\">Генерується автоматично; можна ввести вручну.</div>"+
        "</div>";
      }
      if(c.type === "ktz") return ktzFieldHtml_(c, val);
      if(c.type === "applicant") return applicantFieldHtml_(c, val);
      if(c.type === "select"){
        return "<div class=\"field\"><label>"+esc(c.label)+"</label>"+
          "<input type=\"text\" class=\"ac-input\" data-select-field=\""+c.id+"\" data-dir=\""+esc(c.directory)+"\" value=\""+esc(val)+"\" autocomplete=\"off\" placeholder=\"Почніть вводити…\">"+
        "</div>";
      }
      if(c.type === "status"){
        var st = statusOf(val);
        return "<div class=\"field\"><label>"+esc(c.label)+"</label>"+
          "<button type=\"button\" class=\"select-trigger\" data-status-field=\""+c.id+"\">"+
            (st ? "<span class=\"status-pill\" style=\"background:"+st.color+"22;color:"+st.color+"\"><span class=\"status-dot\" style=\"background:"+st.color+"\"></span>"+esc(st.label)+"</span>" : "<span>Оберіть статус…</span>")+
            iconChevDown()+
          "</button></div>";
      }
      // plain text
      return "<div class=\"field\"><label>"+esc(c.label)+"</label><input type=\"text\" data-field=\""+c.id+"\" value=\""+esc(val)+"\"></div>";
    }).join("");

    var html =
      "<div class=\"modal-head\"><h2>"+(editing?"Редагування заявки":"Нова заявка")+"</h2>"+
        "<button class=\"modal-close\" id=\"mClose\">"+iconX()+"</button></div>"+
      "<div class=\"modal-body\">"+fieldsHtml+"</div>"+
      "<div class=\"modal-foot foot-split\">"+
        (editing && canDeleteRow_(row) ? "<button class=\"btn btn-danger-outline\" id=\"mDelete\">Видалити заявку</button>" : "<span></span>")+
        "<div style=\"display:flex;gap:8px;\">"+
          "<button class=\"btn btn-ghost\" id=\"mCancel\">Скасувати</button>"+
          "<button class=\"btn btn-primary\" id=\"mSave\">Зберегти</button>"+
        "</div>"+
      "</div>";

    openModalShell(html);
    document.getElementById("mClose").addEventListener("click", closeModal);
    document.getElementById("mCancel").addEventListener("click", closeModal);

    var body = document.querySelector(".modal-body");
    body.querySelectorAll("input[data-field]").forEach(function(inp){
      inp.addEventListener("input", function(){ draft[inp.getAttribute("data-field")] = inp.value; });
    });
    body.querySelectorAll("[data-chip-list]").forEach(function(listEl){
      var colId = listEl.getAttribute("data-chip-list");
      var col = state.columns.find(function(c){ return c.id === colId; });
      var input = body.querySelector("[data-chip-input=\""+colId+"\"]");

      function renderChips(){
        listEl.innerHTML = chipsInnerHtml_(draft[colId]);
        listEl.querySelectorAll("[data-chip-remove-idx]").forEach(function(btn){
          btn.addEventListener("click", function(){
            var idx = parseInt(btn.getAttribute("data-chip-remove-idx"), 10);
            draft[colId].splice(idx, 1);
            renderChips();
          });
        });
      }
      function addValue(v){
        v = v.trim();
        if(!v) return;
        if(!Array.isArray(draft[colId])) draft[colId] = [];
        draft[colId].push(v);
        renderChips();
      }
      renderChips(); // прив'язує обробники й до чіпів, відображених при відкритті картки

      var addBtn = body.querySelector("[data-chip-add=\""+colId+"\"]");
      addBtn.addEventListener("click", function(){
        addValue(input.value);
        input.value = "";
        input.focus();
      });
      input.addEventListener("keydown", function(e){
        if(e.key === "Enter"){
          e.preventDefault();
          addValue(input.value);
          input.value = "";
        }
      });
      var autoBtn = body.querySelector("[data-chip-auto=\""+colId+"\"]");
      if(autoBtn){
        autoBtn.addEventListener("click", function(){
          var val = generateAutoValue(col, nextAutoNumber(col, draft[colId], editing ? row.id : null));
          addValue(val);
        });
      }
    });
    body.querySelectorAll("[data-auto-regen]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var colId = btn.getAttribute("data-auto-regen");
        var col = state.columns.find(function(c){ return c.id === colId; });
        var val = generateAutoValue(col, nextAutoNumber(col, null, editing ? row.id : null));
        draft[colId] = val;
        var inp = body.querySelector("input[data-field=\""+colId+"\"]");
        inp.value = val;
      });
    });
    pendingApplicant_ = null;
    body.querySelectorAll("[data-applicant]").forEach(function(box){ wireApplicant_(box, box.getAttribute("data-applicant"), draft); });
    body.querySelectorAll("[data-ktz]").forEach(function(box){ wireKtz_(box, box.getAttribute("data-ktz"), draft); });
    body.querySelectorAll("[data-select-field]").forEach(function(inp){
      var colId = inp.getAttribute("data-select-field");
      var dirKey = inp.getAttribute("data-dir");
      attachComboBox(inp, dirKey, colId, draft);
    });
    body.querySelectorAll("[data-status-field]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var colId = btn.getAttribute("data-status-field");
        var items = (state.directories.statuses||[]).map(function(s){ return {key:s.label, label:s.label, color:s.color}; });
        openOptionPopover(btn, {
          items: items,
          selectedKey: draft[colId],
          placeholder: "Пошук статусу…",
          onSelect: function(key){
            draft[colId] = key;
            var st = statusOf(key);
            btn.innerHTML = "<span class=\"status-pill\" style=\"background:"+st.color+"22;color:"+st.color+"\"><span class=\"status-dot\" style=\"background:"+st.color+"\"></span>"+esc(st.label)+"</span>"+iconChevDown();
          },
          onAdd: function(text){
            var color = SWATCHES[(state.directories.statuses||[]).length % SWATCHES.length];
            state.directories.statuses.push({label:text, color:color});
            persistDirEntry("statuses", {label:text, color:color});
            return text;
          }
        });
      });
    });

    if(editing && canDeleteRow_(row)){
      document.getElementById("mDelete").addEventListener("click", function(){
        confirmDialog({title:"Видалити заявку?", text:"Цю дію не можна скасувати.", confirmLabel:"Видалити"}).then(async function(ok){
          if(!ok) return;
          var result = await persistDeleteRow(rowId);
          if(!result) return;
          if(!result.ok){ toastActionError_(result); return; }
          state = result.state;
          closeModal();
          renderAll();
          showToast("Заявку видалено");
        });
      });
    }

    var saveBtn = document.getElementById("mSave");
    var saveLabel = saveBtn.textContent;

    // Попередження, коли той самий запис хтось змінив, поки ця картка була
    // відкрита: збереження зупиняється, користувач сам вирішує — побачити
    // свіжу версію (свої зміни тоді доведеться внести заново) чи все одно
    // зберегти свій варіант поверх.
    function showConflictBanner(freshRow){
      var old = body.querySelector("#conflictBanner");
      if(old) old.remove();
      var banner = document.createElement("div");
      banner.id = "conflictBanner";
      banner.style.cssText = "background:var(--brick-soft);border:1px solid var(--brick);border-radius:4px;padding:10px 12px;margin-bottom:14px;font-size:12.5px;color:var(--brick);line-height:1.5;";
      var appNumCol = state.columns.find(function(c){ return c.id === "appNum"; });
      banner.innerHTML =
        "Цю заявку (№ "+esc((freshRow.values && freshRow.values.appNum) || row.id)+") вже зберіг "+esc(freshRow.updatedBy ? userName_(freshRow.updatedBy) : "інший користувач")+" — ваше збереження зупинено, щоб нічого не загубити."+
        "<div style=\"display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;\">"+
          "<button type=\"button\" class=\"btn btn-sm btn-ghost\" id=\"conflictReload\">Побачити нову версію</button>"+
          "<button type=\"button\" class=\"btn btn-sm btn-danger-outline\" id=\"conflictForce\">Зберегти мій варіант поверх</button>"+
          (appNumCol ? "<button type=\"button\" class=\"btn btn-sm btn-primary\" id=\"conflictAsNew\">Зберегти як нову заявку</button>" : "")+
        "</div>";
      body.insertBefore(banner, body.firstChild);

      banner.querySelector("#conflictReload").addEventListener("click", function(){
        var localIdx = state.rows.findIndex(function(r){ return r.id === row.id; });
        if(localIdx !== -1) state.rows[localIdx] = freshRow; else state.rows.push(freshRow);
        closeModal();
        renderAll();
        openRequestModal(row.id);
      });
      banner.querySelector("#conflictForce").addEventListener("click", async function(){
        saveBtn.disabled = true;
        saveBtn.textContent = "Збереження…";
        var retry = await persistUpdateRow(row.id, draft, freshRow.rev);
        if(!retry){ saveBtn.disabled = false; saveBtn.textContent = saveLabel; return; }
        if(!retry.ok){
          saveBtn.disabled = false;
          saveBtn.textContent = saveLabel;
          if(retry.error === "conflict") showConflictBanner(retry.row);
          else toastActionError_(retry);
          return;
        }
        state = retry.state;
        closeModal();
        renderAll();
        showToast("Зміни збережено (поверх чужих змін)");
      });
      var asNewBtn = banner.querySelector("#conflictAsNew");
      if(asNewBtn){
        asNewBtn.addEventListener("click", async function(){
          asNewBtn.disabled = true;
          asNewBtn.textContent = "Збереження…";
          // підтягуємо справді актуальний стан з сервера, щоб порахувати
          // вільний номер правильно (чужий запис уже міг додати ще когось)
          var fresh;
          try{ fresh = await loadState(); }catch(e){ fresh = null; }
          if(!fresh){
            asNewBtn.disabled = false;
            asNewBtn.textContent = "Зберегти як нову заявку";
            showToast("Не вдалося завантажити поточні дані. Спробуйте ще раз.","error");
            return;
          }
          state = fresh.state; me = fresh.me;
          var newNum = generateAutoValue(appNumCol, nextAutoNumber(appNumCol));
          var newDraft = Object.assign({}, draft);
          newDraft.appNum = newNum;
          var newRowId = uid("row");
          var created = await persistAddRow(newRowId, newDraft);
          if(!created){
            asNewBtn.disabled = false;
            asNewBtn.textContent = "Зберегти як нову заявку";
            return;
          }
          if(!created.ok){
            asNewBtn.disabled = false;
            asNewBtn.textContent = "Зберегти як нову заявку";
            toastActionError_(created);
            return;
          }
          state = created.state;
          closeModal();
          renderAll();
          showToast("Збережено як нову заявку № " + newNum + renumberNote_(created), "ok", created.renumbered ? 9000 : undefined);
        });
      }
    }

    saveBtn.addEventListener("click", async function(){
      saveBtn.disabled = true;
      saveBtn.textContent = "Збереження…";
      var result = editing
        ? await persistUpdateRow(row.id, draft, knownRev)
        : await persistAddRow(row.id, draft);
      if(!result){
        saveBtn.disabled = false;
        saveBtn.textContent = saveLabel;
        return; // мережева помилка; тост уже показано, картка лишається відкритою, дані не втрачені
      }
      if(!result.ok){
        saveBtn.disabled = false;
        saveBtn.textContent = saveLabel;
        if(result.error === "conflict") showConflictBanner(result.row);
        else toastActionError_(result);
        return;
      }
      state = result.state;
      closeModal();
      renderAll();
      showToast(editing ? "Зміни збережено" : "Заявку додано" + renumberNote_(result), "ok", result.renumbered ? 9000 : undefined);
    });
  }

  /* ============ columns manager ============ */
  var newColType = "text";

  function typeLabel(t){
    return {text:"Текст", date:"Дата", select:"Список", status:"Статус", multitext:"Кілька номерів", ktz:"Колісний ТЗ", applicant:"Заявник"}[t] || t;
  }

  function openColumnsModal(){
    renderColumnsModal();
  }

  function renderColumnsModal(){
    var rowsHtml = state.columns.map(function(c, i){
      var dirTag = (c.type==="select"||c.type==="status") ? "<span class=\"col-dir-name\">"+esc(directoryLabel(c.directory))+"</span>" : "";
      var autoTag = c.auto ? "<span class=\"col-dir-name\">авто</span>" : "";
      return "<div class=\"col-row\" data-col-id=\""+c.id+"\">"+
        "<div class=\"col-reorder\">"+
          "<button data-move=\"up\" "+(i===0?"disabled":"")+" title=\"Вгору\">▲</button>"+
          "<button data-move=\"down\" "+(i===state.columns.length-1?"disabled":"")+" title=\"Вниз\">▼</button>"+
        "</div>"+
        "<input class=\"col-label-input\" data-rename value=\""+esc(c.label)+"\">"+
        "<span class=\"col-type-badge\">"+typeLabel(c.type)+"</span>"+
        dirTag+autoTag+
        "<button class=\"btn btn-icon btn-ghost btn-sm\" data-delete-col title=\"Видалити стовпець\">"+iconTrash()+"</button>"+
      "</div>";
    }).join("");

    var dirOptions = Object.keys(state.directories).map(function(k){
      return "<option value=\""+esc(k)+"\">"+esc(directoryLabel(k))+"</option>";
    }).join("") + "<option value=\"__new__\">+ Новий довідник…</option>";

    var html =
      "<div class=\"modal-head\"><h2>Стовпці журналу</h2><button class=\"modal-close\" id=\"mClose\">"+iconX()+"</button></div>"+
      "<div class=\"modal-body\">"+
        "<div id=\"colList\">"+rowsHtml+"</div>"+
        "<div class=\"add-col-box\">"+
          "<h3>Додати стовпець</h3>"+
          "<div class=\"field\"><input type=\"text\" id=\"newColLabel\" placeholder=\"Назва стовпця\"></div>"+
          "<div class=\"type-toggle\" id=\"typeToggle\">"+
            "<button data-t=\"text\" class=\""+(newColType==="text"?"active":"")+"\">Текст</button>"+
            "<button data-t=\"date\" class=\""+(newColType==="date"?"active":"")+"\">Дата</button>"+
            "<button data-t=\"select\" class=\""+(newColType==="select"?"active":"")+"\">Список (довідник)</button>"+
            "<button data-t=\"status\" class=\""+(newColType==="status"?"active":"")+"\">Статус</button>"+
            "<button data-t=\"ktz\" class=\""+(newColType==="ktz"?"active":"")+"\">Колісний ТЗ</button>"+
            "<button data-t=\"applicant\" class=\""+(newColType==="applicant"?"active":"")+"\">Заявник</button>"+
          "</div>"+
          "<div id=\"typeExtra\"></div>"+
          "<button class=\"btn btn-primary btn-sm\" id=\"btnAddColumn\">+ Додати</button>"+
        "</div>"+
      "</div>"+
      "<div class=\"modal-foot\"><button class=\"btn btn-primary\" id=\"mDone\">Готово</button></div>";

    openModalShell(html, {wide:true});
    document.getElementById("mClose").addEventListener("click", closeModal);
    document.getElementById("mDone").addEventListener("click", closeModal);

    function renderTypeExtra(){
      var extra = document.getElementById("typeExtra");
      if(newColType === "select"){
        extra.innerHTML = "<div class=\"field\"><label>Довідник</label><select id=\"newColDir\" class=\"filter-select\" style=\"width:100%;\">"+dirOptions+"</select></div>"+
          "<div class=\"field\" id=\"newDirNameWrap\" style=\"display:none;\"><label>Назва нового довідника</label><input type=\"text\" id=\"newDirName\" placeholder=\"напр. Види обладнання\"></div>";
        var sel = document.getElementById("newColDir");
        sel.addEventListener("change", function(){
          document.getElementById("newDirNameWrap").style.display = sel.value === "__new__" ? "" : "none";
        });
      } else if(newColType === "text"){
        extra.innerHTML = "<div class=\"checkbox-row\"><input type=\"checkbox\" id=\"newColAuto\"><label for=\"newColAuto\">Автонумерація (автоматично присвоювати номер)</label></div>"+
          "<div class=\"field\" id=\"newColPrefixWrap\" style=\"display:none;\"><label>Префікс номера (необов'язково)</label><input type=\"text\" id=\"newColPrefix\" placeholder=\"напр. Д-\"></div>";
        document.getElementById("newColAuto").addEventListener("change", function(e){
          document.getElementById("newColPrefixWrap").style.display = e.target.checked ? "" : "none";
        });
      } else {
        extra.innerHTML = "";
      }
    }
    renderTypeExtra();

    document.querySelectorAll("#typeToggle button").forEach(function(btn){
      btn.addEventListener("click", function(){
        newColType = btn.getAttribute("data-t");
        document.querySelectorAll("#typeToggle button").forEach(function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
        renderTypeExtra();
      });
    });

    document.querySelectorAll("#colList [data-move]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var row = btn.closest(".col-row");
        var id = row.getAttribute("data-col-id");
        var idx = state.columns.findIndex(function(c){ return c.id===id; });
        var dir = btn.getAttribute("data-move");
        var swapWith = dir === "up" ? idx-1 : idx+1;
        if(swapWith < 0 || swapWith >= state.columns.length) return;
        var tmp = state.columns[idx];
        state.columns[idx] = state.columns[swapWith];
        state.columns[swapWith] = tmp;
        persistConfig();
        renderColumnsModal();
        renderAll();
      });
    });

    document.querySelectorAll("#colList [data-rename]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var row = inp.closest(".col-row");
        var id = row.getAttribute("data-col-id");
        var col = state.columns.find(function(c){ return c.id===id; });
        col.label = inp.value.trim() || col.label;
        persistConfig();
        renderAll();
      });
    });

    document.querySelectorAll("#colList [data-delete-col]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var row = btn.closest(".col-row");
        var id = row.getAttribute("data-col-id");
        if(state.columns.length <= 1){
          showToast("У журналі має лишитись хоча б один стовпець","error");
          return;
        }
        confirmDialog({title:"Видалити стовпець?", text:"Дані в цьому стовпці для всіх заявок буде втрачено.", confirmLabel:"Видалити"}).then(function(ok){
          if(!ok) return;
          state.columns = state.columns.filter(function(c){ return c.id !== id; });
          state.rows.forEach(function(r){ delete r.values[id]; });
          delete filters.dateRanges[id];
          delete filters.selectFilters[id];
          delete filters.statusFilters[id];
          delete filters.textFilters[id];
          persistConfig();
          renderColumnsModal();
          renderAll();
          showToast("Стовпець видалено");
        });
      });
    });

    document.getElementById("btnAddColumn").addEventListener("click", function(){
      var label = document.getElementById("newColLabel").value.trim();
      if(!label){ showToast("Введіть назву стовпця","error"); return; }
      var col = { id: uid("col"), label: label, type: newColType };
      if(newColType === "select"){
        var dirSel = document.getElementById("newColDir").value;
        if(dirSel === "__new__"){
          var newName = document.getElementById("newDirName").value.trim();
          if(!newName){ showToast("Введіть назву нового довідника","error"); return; }
          var key = "dir_" + uid("");
          state.directories[key] = [];
          state.directoryLabels[key] = newName;
          col.directory = key;
        } else {
          col.directory = dirSel;
        }
      } else if(newColType === "status"){
        col.directory = "statuses";
      } else if(newColType === "text"){
        var autoChecked = document.getElementById("newColAuto").checked;
        if(autoChecked){
          col.auto = true;
          col.autoPrefix = document.getElementById("newColPrefix").value.trim();
        }
      }
      state.columns.push(col);
      persistConfig();
      document.getElementById("newColLabel").value = "";
      renderColumnsModal();
      renderAll();
      showToast("Стовпець додано");
    });
  }

  /* ============ directories manager ============ */
  var activeDirTab = "customers";

  function openDirectoriesModal(){
    if(!state.directories[activeDirTab]) activeDirTab = Object.keys(state.directories)[0];
    renderDirectoriesModal();
  }

  function renderDirectoriesModal(){
    var tabsHtml = Object.keys(state.directories).map(function(k){
      return "<button class=\"dir-tab"+(k===activeDirTab?" active":"")+"\" data-tab=\""+esc(k)+"\">"+esc(directoryLabel(k))+"</button>";
    }).join("");

    var isStatus = activeDirTab === "statuses";
    var entries = state.directories[activeDirTab] || [];
    var listHtml = entries.map(function(entry, i){
      if(isStatus){
        var swHtml = SWATCHES.map(function(sw){
          return "<span class=\"swatch"+(sw===entry.color?" active-swatch":"")+"\" style=\"background:"+sw+"\" data-swatch=\""+sw+"\" data-idx=\""+i+"\"></span>";
        }).join("");
        return "<div class=\"dir-entry\">"+
          "<input type=\"text\" data-entry-label data-idx=\""+i+"\" value=\""+esc(entry.label)+"\">"+
          "<div class=\"swatch-row\">"+swHtml+"</div>"+
          "<button class=\"btn btn-icon btn-ghost btn-sm\" data-remove-entry data-idx=\""+i+"\">"+iconTrash()+"</button>"+
        "</div>";
      }
      return "<div class=\"dir-entry\">"+
        "<input type=\"text\" data-entry-label data-idx=\""+i+"\" value=\""+esc(entry)+"\">"+
        "<button class=\"btn btn-icon btn-ghost btn-sm\" data-remove-entry data-idx=\""+i+"\">"+iconTrash()+"</button>"+
      "</div>";
    }).join("") || "<p style=\"color:var(--ink-faint);font-size:12.5px;\">Список порожній. Додайте перший запис нижче.</p>";

    var html =
      "<div class=\"modal-head\"><h2>Довідники</h2><button class=\"modal-close\" id=\"mClose\">"+iconX()+"</button></div>"+
      "<div class=\"modal-body\">"+
        "<div class=\"dir-tabs\">"+tabsHtml+"</div>"+
        "<div id=\"dirList\">"+listHtml+"</div>"+
        "<div class=\"add-entry-row\">"+
          "<input type=\"text\" id=\"newEntryInput\" placeholder=\"Новий запис…\">"+
          "<button class=\"btn btn-primary btn-sm\" id=\"btnAddEntry\">Додати</button>"+
        "</div>"+
      "</div>"+
      "<div class=\"modal-foot\"><button class=\"btn btn-primary\" id=\"mDone\">Готово</button></div>";

    openModalShell(html, {wide:true});
    document.getElementById("mClose").addEventListener("click", closeModal);
    document.getElementById("mDone").addEventListener("click", closeModal);

    document.querySelectorAll(".dir-tab").forEach(function(tab){
      tab.addEventListener("click", function(){
        activeDirTab = tab.getAttribute("data-tab");
        renderDirectoriesModal();
      });
    });

    document.querySelectorAll("[data-entry-label]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var idx = parseInt(inp.getAttribute("data-idx"), 10);
        if(isStatus) state.directories[activeDirTab][idx].label = inp.value;
        else state.directories[activeDirTab][idx] = inp.value;
        persistConfig();
        renderAll();
      });
    });

    document.querySelectorAll("[data-swatch]").forEach(function(sw){
      sw.addEventListener("click", function(){
        var idx = parseInt(sw.getAttribute("data-idx"), 10);
        state.directories.statuses[idx].color = sw.getAttribute("data-swatch");
        persistConfig();
        renderDirectoriesModal();
        renderAll();
      });
    });

    document.querySelectorAll("[data-remove-entry]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var idx = parseInt(btn.getAttribute("data-idx"), 10);
        state.directories[activeDirTab].splice(idx, 1);
        persistConfig();
        renderDirectoriesModal();
        renderAll();
      });
    });

    document.getElementById("btnAddEntry").addEventListener("click", function(){
      var val = document.getElementById("newEntryInput").value.trim();
      if(!val) return;
      if(isStatus){
        var color = SWATCHES[entries.length % SWATCHES.length];
        state.directories.statuses.push({label:val, color:color});
      } else {
        state.directories[activeDirTab].push(val);
      }
      persistConfig();
      renderDirectoriesModal();
      renderAll();
    });
  }

  // Посада відповідального виконавця за прізвищем (для підпису в «Відп. виконавець»)
  var DOC_POSITIONS = [
    [/(сергеєв|сєргєєв)/i, "провідний інженер"],
    [/руденк/i, "молодший науковий співробітник"]
  ];
  var DOC_MONTHS = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
  var DOC_BLANK = "____________________";

  // За значенням «Назва послуги» обирає зразок: над (переобладнаний/звичайний), б/к або ОТК
  function docTemplateFor_(svc){
    var s = String(svc || "").toLowerCase().replace(/[’ʼ`]/g, "'");
    if(/обов'язков\S*\s+техніч\S*\s+контрол/.test(s)) return "otk";
    if(/індивідуальн\S*\s+затверд/.test(s)) return /\(б\/к\)/.test(s) ? "bk" : "over";
    return null;
  }
  function docDate_(iso){
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
    return m ? "«" + m[3] + "» " + DOC_MONTHS[parseInt(m[2], 10) - 1] + " " + m[1] + " р." : "";
  }
  function docDatSurname_(sn, female){
    var s = String(sn || "");
    if(!s) return s;
    if(female){
      if(/(ова|ева|єва|іна|їна|ина|ська|цька|зька)$/i.test(s)) return s.slice(0, -1) + "ій";
      if(/а$/i.test(s)) return s.slice(0, -1) + "і";
      return s; // нескладне жіноче прізвище на приголосну не відмінюється
    }
    if(/ий$/i.test(s)) return s.slice(0, -2) + "ому";
    if(/ій$/i.test(s)) return s.slice(0, -2) + "ію";
    if(/ець$/i.test(s)) return s.slice(0, -3) + "цю";
    if(/[ьй]$/i.test(s)) return s.slice(0, -1) + "ю";
    if(/ко$/i.test(s)) return s.slice(0, -2) + "ку";
    if(/о$/i.test(s)) return s.slice(0, -1) + "у";
    if(/[бвгґджзклмнпрстфхцчшщ]$/i.test(s)) return s + "у";
    return s;
  }
  // Прізвище та ініціали користувача з поля «Вніс» («Прізвище Ім'я [По батькові]»)
  function docPerson_(username){
    var full = userName_(username) || "";
    if(!/[А-Яа-яІіЇїЄєҐґ]/.test(full)) return null;
    var w = full.trim().split(/\s+/).filter(Boolean);
    var sn = w[0], first = w[1] || "", patr = w[2] || "";
    var initials = (first ? first.charAt(0).toUpperCase() + "." : "") + (patr ? patr.charAt(0).toUpperCase() + "." : "");
    var maleA = /^(микола|лука|кузьма|сава|хома|никита|ілля|гаврило)$/i;
    var female = first ? (/[ая]$/i.test(first) && !maleA.test(first)) : /(ова|ева|єва|ська|цька|іна|ина)$/i.test(sn);
    var pos = "";
    DOC_POSITIONS.forEach(function(p){ if(!pos && p[0].test(sn)) pos = p[1]; });
    return {
      exec: (initials ? initials + " " : "") + sn,
      execDat: docDatSurname_(sn, female) + (initials ? " " + initials : ""),
      position: pos
    };
  }
  function docApplicant_(val){
    var v = String(val || "").trim();
    if(!v) return null;
    var found = applicantList_().find(function(r){ return applicantDisplay_(r) === v; });
    var rec = found ? Object.assign({ type:"legal", name:"", edrpou:"", passport:"", idCode:"", address:"", represents:"" }, found) : legacyApplicant_(v);
    return rec;
  }
  function docValues_(row){
    var cols = state.columns;
    function colBy(fn){ return cols.find(fn); }
    var appCol = colBy(function(c){ return c.id === "appNum"; });
    var dateCol = colBy(function(c){ return c.type === "date"; });
    var ktzCol = colBy(function(c){ return c.type === "ktz"; });
    var apCol = colBy(function(c){ return c.type === "applicant"; });
    var vals = {};
    var v = function(col){ return col ? row.values[col.id] : ""; };
    vals.appnum = String(v(appCol) || "");
    vals.regdate = docDate_(v(dateCol));
    var rec = docApplicant_(v(apCol));
    if(rec){
      var legal = rec.type !== "individual";
      vals.applicant = legal ? applicantDisplay_(rec) : rec.name;
      vals.address = rec.address || "";
      vals.passport = legal ? "" : (rec.passport || "");
      vals.idcode = legal ? "" : (rec.idCode || "");
      vals.represents = rec.represents || "";
      vals.pib = legal ? "" : rec.name;
      vals.ownerName = rec.name || "";
      vals.ownerReq = legal ? (rec.edrpou ? "код ЄДРПОУ " + rec.edrpou : "") : (rec.passport || "");
      vals.ownerIpn = legal ? "" : (rec.idCode || "");
      vals.ownerAddr = rec.address || "";
      vals.ownerDoc = legal ? "" : (rec.passport || "");
    }
    var k = ktzParse_(v(ktzCol));
    var mm;
    if(k.marka && k.model === "__other__") mm = (k.marka + " " + k.custom).trim();
    else if(k.custom) mm = k.custom.trim();
    else mm = [k.marka, k.model].join(" ").trim();
    var qty = parseInt(k.qty, 10);
    var purposeTxt = k.purpose || "";
    // Старі записи вільним текстом: початок із малих кириличних слів («автомобіль пасажирський …») — це призначення КТЗ
    if(!purposeTxt && !k.marka && mm){
      var toks = mm.split(/\s+/), n = 0;
      while(n < toks.length && /^[а-яіїєґ'’()\-,]+$/.test(toks[n]) && !/^(на|базі)$/.test(toks[n])) n++;
      if(n > 0 && n < toks.length){
        purposeTxt = toks.slice(0, n).join(" ").replace(/[,\s]+$/, "");
        mm = toks.slice(n).join(" ");
      }
    }
    vals.purpose = purposeTxt;
    vals.year = k.year || "";
    vals.marka = mm ? mm + (qty > 1 ? " (" + qty + " од.)" : "") : "";
    if(k.marka){
      vals.otkMarka = k.marka;
      vals.otkModel = k.model === "__other__" ? k.custom : (k.model || "");
    } else {
      // Вільний текст: шукаємо відому марку всередині рядка, решта — модель
      var low = mm.toLowerCase(), bestB = "", bestAt = -1;
      Object.keys(ktzData_().marques).forEach(function(bk){
        var nm = bk.replace(/\s*\(.*\)\s*/, "").trim();
        if(!nm || nm === "Інша марка") return;
        var at = low.indexOf(nm.toLowerCase());
        var okL = at === 0 || (at > 0 && /[\s,;(]/.test(low.charAt(at - 1)));
        var okR = at >= 0 && (at + nm.length === low.length || /[\s,;)]/.test(low.charAt(at + nm.length)));
        if(at >= 0 && okL && okR && nm.length > bestB.length){ bestB = nm; bestAt = at; }
      });
      if(bestB){
        vals.otkMarka = mm.substr(bestAt, bestB.length);
        vals.otkModel = mm.slice(bestAt + bestB.length).replace(/\s*[-–—,]?\s*\d+\s*(од\.?|шт\.?)\s*$/i, "").replace(/^[\s,;:–—-]+|[\s,;:–—-]+$/g, "");
      } else { vals.otkMarka = mm; vals.otkModel = ""; }
    }
    var who = docPerson_(row.createdBy);
    vals.exec = who ? who.exec : DOC_BLANK;
    vals.execDat = who ? who.execDat : DOC_BLANK;
    vals.position = (who && who.position) ? who.position : DOC_BLANK;
    return vals;
  }
  function docXmlEsc_(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  async function generateApplication_(rowId){
    var row = state.rows.find(function(r){ return r.id === rowId; });
    if(!row) return;
    var svcCol = state.columns.find(function(c){ return c.directory === "services"; }) ||
                 state.columns.find(function(c){ return /послуг/i.test(String(c.label || "")); });
    var svc = svcCol ? row.values[svcCol.id] : "";
    var tpl = docTemplateFor_(svc);
    if(!tpl){
      showToast(svc ? "Для послуги «" + svc + "» зразка заяви немає" : "Спочатку вкажіть «Назву послуги» у заявці", "error");
      return;
    }
    if(typeof JSZip === "undefined"){
      showToast("Не вдалося завантажити модуль Word. Перевірте інтернет-з'єднання і спробуйте ще раз.", "error");
      return;
    }
    try{
      var vals = docValues_(row);
      var zip = await JSZip.loadAsync(DOC_TPL[tpl], { base64: true });
      var xml = await zip.file("word/document.xml").async("string");
      xml = xml.replace(/\{\{(\w+)\|([^}]*)\}\}/g, function(_, key, def){
        var val = vals[key];
        return val ? docXmlEsc_(val) : def;
      });
      zip.file("word/document.xml", xml);
      var blob = await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
      var num = (vals.appnum || "").replace(/[^0-9A-Za-zА-Яа-яІіЇїЄєҐґ.\-]+/g, "_").replace(/^_+|_+$/g, "");
      var name = "Заява_" + (num || "без_номера") + ".docx";
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
      showToast("Заяву сформовано: " + name);
    }catch(e){
      showToast("Не вдалося сформувати заяву", "error");
    }
  }

  /* ============ export ============ */
  function exportXLSX(){
    if(typeof XLSX === "undefined"){
      showToast("Не вдалося завантажити модуль Excel-експорту. Перевірте інтернет-з'єднання і спробуйте ще раз.","error");
      return;
    }
    try{
      var headers = ["№ п/п"].concat(state.columns.map(function(c){ return c.label; }), ["Вніс", "Дата внесення", "Остання зміна (хто)", "Остання зміна (коли)"]);
      var data = [headers];
      state.rows.forEach(function(r, i){
        var row = [i+1].concat(state.columns.map(function(c){
          var v = r.values[c.id];
          if(v == null) return "";
          if(Array.isArray(v)) return v.join("; ");
          if(c.type === "date") return fmtDate(v);
          return v;
        }), [userName_(r.createdBy), fmtDateTime(r.createdAt), userName_(r.updatedBy), fmtDateTime(r.updatedAt)]);
        data.push(row);
      });

      var ws = XLSX.utils.aoa_to_sheet(data);
      // орієнтовна ширина кожного стовпця під вміст
      ws["!cols"] = headers.map(function(h, i){
        var maxLen = h.length;
        data.forEach(function(row){
          var cell = row[i];
          if(cell != null) maxLen = Math.max(maxLen, String(cell).length);
        });
        return { wch: Math.min(Math.max(maxLen + 2, 10), 45) };
      });

      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Журнал");

      var stamp = todayISO();
      XLSX.writeFile(wb, "Журнал_заявок_" + stamp + ".xlsx");
      showToast("Файл .xlsx завантажено");
    }catch(e){
      showToast("Не вдалося сформувати файл Excel","error");
    }
  }

  // Завантажує журнал і показує його. Викликається після входу та при відновленні сесії.
  async function startApp_(){
    var data;
    try{
      data = await loadState();
    }catch(e){
      if(e && e.isAuthError) renderAuthErrorScreen();
      else if(e && e.isSessionError){ clearSession_(); renderLoginScreen({ message: "Сесію завершено — увійдіть знову." }); }
      else if(e && e.isCorrupted) renderMessageScreen_("Дані журналу в Google Таблиці пошкоджені: аркуш «Data» містить не журнал. Сервер нічого не перезаписував. Відновіть аркуш із історії версій таблиці (Файл → Історія версій) або з резервного аркуша «Backup …» і оновіть сторінку.");
      else if(e && e.notInitialized) renderMessageScreen_("Журнал ще не налаштовано. Попросіть адміністратора увійти першим.");
      else renderConnectionErrorScreen();
      return;
    }
    state = data.state; me = data.me;
    document.getElementById("lockLayer").innerHTML = "";
    document.getElementById("app").style.display = "";
    wireControls();
    applyRoleUi_();
    renderAll();
  }

  function handleSessionExpired_(){
    if(sessionExpiredShown) return;
    sessionExpiredShown = true;
    var prev = me ? me.username : null;
    clearSession_();
    renderLoginScreen({ message: "Сесію завершено — увійдіть знову. Дані у відкритій картці не втрачено.", resumeFor: prev });
  }

  async function afterLogin_(resumeFor){
    sessionExpiredShown = false;
    if(resumeFor && me && me.username === resumeFor && state){
      document.getElementById("lockLayer").innerHTML = "";
      try{ var d = await loadState(); state = d.state; me = d.me; }catch(e){}
      applyRoleUi_();
      renderAll();
      return;
    }
    closeModal();
    await startApp_();

  function renderLoginScreen(opts){
    opts = opts || {};
    var layer = document.getElementById("lockLayer");
    layer.innerHTML =
      "<div class=\"lock-overlay\"><div class=\"lock-card\">"+
        lockBrandHtml()+
        (opts.message ? "<p class=\"lock-intro\">"+esc(opts.message)+"</p>" : "")+
        "<div class=\"field\"><label>Логін</label><input type=\"text\" id=\"lpUser\" autocomplete=\"username\" autocapitalize=\"none\" spellcheck=\"false\"></div>"+
        "<div class=\"field\"><label>Пароль</label><input type=\"password\" id=\"lpPass\" autocomplete=\"current-password\"></div>"+
        "<div class=\"lock-error\" id=\"lpError\"></div>"+
        "<button class=\"btn btn-primary\" style=\"width:100%;justify-content:center;\" id=\"lpSubmit\">Увійти</button>"+
      "</div></div>";
    var userEl = document.getElementById("lpUser"), passEl = document.getElementById("lpPass");
    var errEl = document.getElementById("lpError"), btn = document.getElementById("lpSubmit");
    async function tryLogin(){
      var username = userEl.value.trim(), password = passEl.value;
      if(!username || !password){ errEl.textContent = "Введіть логін і пароль"; return; }
      btn.disabled = true; btn.textContent = "Вхід…"; errEl.textContent = "";
      var r;
      try{
        r = await rpc_("login", { username: username, password: password }, true);
      }catch(e){
        btn.disabled = false; btn.textContent = "Увійти";
        errEl.textContent = "Немає зв'язку з сервером. Спробуйте ще раз.";
        return;
      }
      if(r.error === "unauthorized"){ renderAuthErrorScreen(); return; }
      if(!r.ok){
        btn.disabled = false; btn.textContent = "Увійти";
        errEl.textContent = r.error === "locked" ? "Забагато невдалих спроб. Спробуйте через 10 хвилин."
                          : r.error === "busy" ? errorText_("busy")
                          : "Невірний логін або пароль";
        passEl.value = ""; passEl.focus();
        return;
      }
      session = { token: r.token, expiresAt: r.expiresAt };
      me = r.me;
      saveSession_();
      afterLogin_(opts.resumeFor);
    }
    btn.addEventListener("click", tryLogin);
    layer.querySelectorAll("input").forEach(function(inp){
      inp.addEventListener("keydown", function(e){ if(e.key === "Enter") tryLogin(); });
    });
    (opts.resumeFor ? passEl : userEl).focus();
    if(opts.resumeFor) userEl.value = opts.resumeFor;
  }

    if(controlsWired) return;
    controlsWired = true;
    // перед відкриттям форми беремо свіжий стан, щоб номер заявки рахувався від актуальних даних
    async function openNewRequest_(){
      try{
        var fresh = await loadState();
        if(fresh && fresh.state){ state = fresh.state; me = fresh.me; renderAll(); }
      }catch(e){}
      openRequestModal(null);
    }
    document.getElementById("btnAddRow").addEventListener("click", openNewRequest_);
    document.getElementById("btnAddRowEmpty").addEventListener("click", openNewRequest_);
    document.getElementById("btnColumns").addEventListener("click", openColumnsModal);
    document.getElementById("btnKtz").addEventListener("click", openKtzModal);
    document.getElementById("btnDirectories").addEventListener("click", openDirectoriesModal);
    document.getElementById("btnExport").addEventListener("click", exportXLSX);
    document.getElementById("btnChangePassword").addEventListener("click", openChangePasswordModal);
    document.getElementById("btnUsers").addEventListener("click", openUsersModal);
    document.getElementById("btnLock").addEventListener("click", logout_);
    document.getElementById("sortSelect").addEventListener("change", function(e){ setSort_(e.target.value); renderRows(); });
    document.getElementById("searchInput").addEventListener("input", function(e){
      filters.q = e.target.value.trim();
      renderRows();
    });
  }

  function renderSetupNeededScreen(){
    var layer = document.getElementById("lockLayer");
    layer.innerHTML =
      "<div class=\"lock-overlay\"><div class=\"lock-card\" style=\"max-width:440px;\">"+
        lockBrandHtml()+
        "<p class=\"lock-intro\" style=\"text-align:left;\">Журнал ще не підключено до сховища даних. У файлі, в тезі <code>&lt;script&gt;</code>, знайдіть рядки:</p>"+
        "<p style=\"font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:8px 10px;overflow:auto;\">var APPS_SCRIPT_URL = \"СЮДИ_ВСТАВТЕ_URL_ДОДАТКУ\";<br>var ACCESS_KEY = \"СЮДИ_ВСТАВТЕ_СЕКРЕТНИЙ_КЛЮЧ\";</p>"+
        "<p class=\"lock-intro\" style=\"text-align:left;\">і вставте URL вашого Apps Script Web App та секретний ключ (той самий, що й у Code.gs), після чого збережіть файл і оновіть сторінку.</p>"+
        "<button class=\"btn btn-primary\" style=\"width:100%;justify-content:center;\" id=\"setupRetry\">Оновити сторінку</button>"+
      "</div></div>";
    document.getElementById("setupRetry").addEventListener("click", function(){ location.reload(); });
  }

  function renderAuthErrorScreen(){
    var layer = document.getElementById("lockLayer");
    layer.innerHTML =
      "<div class=\"lock-overlay\"><div class=\"lock-card\" style=\"max-width:440px;\">"+
        lockBrandHtml()+
        "<p class=\"lock-intro\" style=\"text-align:left;\">Бекенд відповів «невірний ключ доступу». Значення <code>ACCESS_KEY</code> у цьому HTML-файлі не збігається зі значенням <code>ACCESS_KEY</code> у Code.gs вашого Apps Script. Перевірте, що обидва рядки — точна копія одне одного (без зайвих пробілів), збережіть файли і спробуйте ще раз.</p>"+
        "<button class=\"btn btn-primary\" style=\"width:100%;justify-content:center;\" id=\"authRetry\">Спробувати знову</button>"+
      "</div></div>";
    document.getElementById("authRetry").addEventListener("click", function(){ location.reload(); });
  }

  function renderConnectionErrorScreen(){
    var layer = document.getElementById("lockLayer");
    layer.innerHTML =
      "<div class=\"lock-overlay\"><div class=\"lock-card\" style=\"max-width:440px;\">"+
        lockBrandHtml()+
        "<p class=\"lock-intro\" style=\"text-align:left;\">Не вдалося з'єднатися з бекендом журналу. Перевірте інтернет-з'єднання, правильність URL Apps Script у файлі, і що розгорнутий пакет має доступ «Anyone».</p>"+
        "<button class=\"btn btn-primary\" style=\"width:100%;justify-content:center;\" id=\"connRetry\">Спробувати знову</button>"+
      "</div></div>";
    document.getElementById("connRetry").addEventListener("click", function(){ location.reload(); });
  }

  /* ============ init ============ */
  async function init(){
    if(!isConfigured()){
      renderSetupNeededScreen();
      return;
    }
    session = restoreSession_();
    if(!session){
      renderLoginScreen({});
      return;
    }
    await startApp_();
  }

  init();
})();
</script>
</body>
</html>
